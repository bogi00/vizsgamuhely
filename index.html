észetes jelként szolgálhat."],["Egy turistatérképen a jelmagyarázat a jelek ___ adja meg.","értelmezési szabályát","kiejtésének hangerejét","kötelező szórendjét","A közösen ismert jelkulcs köti össze a jelet az általa jelölt tartalommal."],["A jel olyan általunk érzékelhető dolog, mely nem csupán önmagában fontos (például szép vagy érdekes), hanem valamilyen információt hordoz, azaz ___ van.","jelentése",null,null,"A jel olyan általunk érzékelhető dolog, mely nem csupán önmagában fontos (például szép vagy érdekes), hanem valamilyen információt hordoz, azaz jelentése van.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Egy vörös rózsa a kertben csupán egy illatos ___, de egy randevún átnyújtva már jellé válik.","virág",null,null,"Egy vörös rózsa a kertben csupán egy illatos virág, de egy randevún átnyújtva már jellé válik.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Jel és jelentés egymást ___: nem képzelhető el olyan jel, melynek nincs jelentése, de ez fordítva is igaz: nincs olyan jelentés, melyet nem valamilyen jel hordozna.","feltételezi",null,null,"Jel és jelentés egymást feltételezi: nem képzelhető el olyan jel, melynek nincs jelentése, de ez fordítva is igaz: nincs olyan jelentés, melyet nem valamilyen jel hordozna.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["A környezetünkben előfordulnak ___ jelek.","természetes",null,null,"A környezetünkben előfordulnak természetes jelek.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Ezt a ___ idegen szóval konvenciónak nevezzük.","közmegegyezést",null,null,"Ezt a közmegegyezést idegen szóval konvenciónak nevezzük.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["A piros például a közlekedésben tilos jelzés, a naptárban az ünnepnapokat ___, de a tűzoltókocsi színe is ugyanez.","jelöli",null,null,"A piros például a közlekedésben tilos jelzés, a naptárban az ünnepnapokat jelöli, de a tűzoltókocsi színe is ugyanez.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["A ___ jelek jelentését tehát meg kell tanulnunk.","konvencionális",null,null,"A konvencionális jelek jelentését tehát meg kell tanulnunk.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["A nyelvi jelek mesterséges, ___ jelek.","konvencionális",null,null,"A nyelvi jelek mesterséges, konvencionális jelek.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["A ___ az, amit érzékelünk, a nyelvi jel esetében ez a hangsor vagy hangalak, illetve annak írott képe.","jelölő",null,null,"A jelölő az, amit érzékelünk, a nyelvi jel esetében ez a hangsor vagy hangalak, illetve annak írott képe.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["A ___ a hozzá kapcsolt fogalom, mely elvont és általános.","jelölt",null,null,"A jelölt a hozzá kapcsolt fogalom, mely elvont és általános.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Az alma szó esetében például az A L M A hangsor a ___, az alma fogalma, „almasága” (gömbölyded, közepes méretű gyümölcs, mely lehet piros, sárga vagy akár zöld, de semmiképp sem kék stb.) a jelölt.","jelölő",null,null,"Az alma szó esetében például az A L M A hangsor a jelölő, az alma fogalma, „almasága” (gömbölyded, közepes méretű gyümölcs, mely lehet piros, sárga vagy akár zöld, de semmiképp sem kék stb.) a jelölt.","2026. 10. 14. magyar nyelv 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Különítsd el a jelölőt, a jelöltet és a jeltárgyat az „alma” példáján.","Jelölő az alma szó érzékelhető hangalakja vagy írott képe. Jelölt az alma általános fogalma. Jeltárgy az a konkrét alma, amelyre az adott helyzetben utalunk.",null,null,"","",true]]},{"title":"Nyelv és beszéd","sources":[{"name":"2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx","url":null}],"qs":[["A közösség által használt jelek és szabályok rendszere a ___.","nyelv","beszédhelyzet","hangfelvétel"],["Amikor valaki elmeséli, mi történt vele, az egyéni nyelvhasználat, azaz ___ példája.","beszéd","nyelvtörténet","ábécé"],["Két ember ugyanazt a nyelvet használja, mégis eltér a szóválasztásuk. Ez a ___ különbségét példázza.","beszédük","nyelvük ábécéjének","hangképző szerveik számának","Ugyanazt a közösségi szabályrendszert egyénileg használják."],["Egy új magyar mondatot akkor is megérthetsz, ha még sosem hallottad, mert ismered a ___.","szavakat és összekapcsolásuk szabályait","mondat eredeti felvételét","beszélő minden korábbi mondatát","A nyelv elemei és szabályai lehetővé teszik új közlések létrehozását és értelmezését."],["A ___ egyszerre elemrendszer és az őt alkotó elemek használati szabályainak rendszere.","nyelv",null,null,"A nyelv egyszerre elemrendszer és az őt alkotó elemek használati szabályainak rendszere.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Ezek alkalmazásával valósítható meg a legfontosabb emberi ___ tevékenység, a beszéd.","kommunikációs",null,null,"Ezek alkalmazásával valósítható meg a legfontosabb emberi kommunikációs tevékenység, a beszéd.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A beszéd alapja a nyelv, hiszen csak nyelvi elemek és szabályok alkalmazásával hozható létre, ugyanakkor nyelv nem létezik anélkül, hogy ___ (vagy írásban) ne nyilvánulna meg.","beszédben",null,null,"A beszéd alapja a nyelv, hiszen csak nyelvi elemek és szabályok alkalmazásával hozható létre, ugyanakkor nyelv nem létezik anélkül, hogy beszédben (vagy írásban) ne nyilvánulna meg.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Nyelv és ___ tehát szorosan összefügg, azonban fontos, hogy világosan lássuk a két fogalom közötti különbséget is.","beszéd",null,null,"Nyelv és beszéd tehát szorosan összefügg, azonban fontos, hogy világosan lássuk a két fogalom közötti különbséget is.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A ___ sokan gondolják még ma is, hogy az emberektől függetlenül, önmagában létezik.","nyelvről",null,null,"A nyelvről sokan gondolják még ma is, hogy az emberektől függetlenül, önmagában létezik.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Valójában azonban a ___ nem több, de nem is kevesebb, mint az a képességünk, hogy egy jel- és szabályrendszer használatával megértsük egymást.","nyelv",null,null,"Valójában azonban a nyelv nem több, de nem is kevesebb, mint az a képességünk, hogy egy jel- és szabályrendszer használatával megértsük egymást.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A ___ tehát a tudatunkban lakozik, gondolkodásunk része.","nyelv",null,null,"A nyelv tehát a tudatunkban lakozik, gondolkodásunk része.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A nyelvi elemeket és szabályokat agyunk egyes területein tároljuk, és onnan hívjuk elő őket, amikor használatukkal ___.","kommunikálunk",null,null,"A nyelvi elemeket és szabályokat agyunk egyes területein tároljuk, és onnan hívjuk elő őket, amikor használatukkal kommunikálunk.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A beszéd, pontosabb megnevezéssel ___ pedig a nyelv aktív használata: produkálása és feldolgozása.","beszédtevékenység",null,null,"A beszéd, pontosabb megnevezéssel beszédtevékenység pedig a nyelv aktív használata: produkálása és feldolgozása.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A nyelv és a gondolkodás, ill. a ___ és a gondolkodás összefüggnek, hatnak egymásra.","beszéd",null,null,"A nyelv és a gondolkodás, ill. a beszéd és a gondolkodás összefüggnek, hatnak egymásra.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az igényes és tudatos ___ segíti önismeretedet, általa pontosabban tudod kifejezni a gondolataidat, pozitívan befolyásolja a rólad alkotott képet.","nyelvhasználat",null,null,"Az igényes és tudatos nyelvhasználat segíti önismeretedet, általa pontosabban tudod kifejezni a gondolataidat, pozitívan befolyásolja a rólad alkotott képet.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A nyelvi kifejezőeszközök szegényedése, az egysíkú kifejezésmód beszűkíti a ___ lehetőségeinket.","kommunikációs",null,null,"A nyelvi kifejezőeszközök szegényedése, az egysíkú kifejezésmód beszűkíti a kommunikációs lehetőségeinket.","2026. 11. 04-07. magyar nyelv 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Hogyan jelenik meg a nyelv közösségi és a beszéd egyéni jellege egy rövid üdvözlésben?","A szavakat és nyelvtani mintákat a közösség ismeri. A beszélő ezekből választ például a „Szia!” és a „Jó napot kívánok!” között a helyzetnek megfelelően.",null,null,"","",true]]},{"title":"Beszédszervek és hangképzés","sources":[{"name":"2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx","url":null}],"qs":[["A hangszalagok a ___ találhatók.","gégében","orrüregben","szájpadláson"],["Zöngés hang képzésekor a hangszalagok ___.","rezegnek","teljesen mozdulatlanok","a fogsorhoz érnek"],["A „p” és „b” képzésekor az ajkak zárat alkotnak. A kettő közül a zöngés hang a ___.","b","p","mindkettő egyformán zöngés","A „b” képzésekor a hangszalagok rezegnek, a „p” zöngétlen."],["A beszédhez szükséges kiáramló levegőt szokásos kilégzéses beszédkor a ___ biztosítja.","tüdő","nyelv","fogazat","A tüdőből kiáramló levegőt a gége és a toldalékcső szervei alakítják beszédhanggá."],["A szabályos rezgő mozgás – például húr, inga, ___, hangvilla mozgása – szabályos szerkezetű hangokat eredményez, amelyeket zenei hangoknak nevezünk.","hangszalagok",null,null,"A szabályos rezgő mozgás – például húr, inga, hangszalagok, hangvilla mozgása – szabályos szerkezetű hangokat eredményez, amelyeket zenei hangoknak nevezünk.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A ___ mindenekelőtt levegőre van szükség: a beszédhangok ugyanis a tüdőnkből kiáramló levegő részecskéinek mozgása révén jönnek létre.","beszédképzéshez",null,null,"A beszédképzéshez mindenekelőtt levegőre van szükség: a beszédhangok ugyanis a tüdőnkből kiáramló levegő részecskéinek mozgása révén jönnek létre.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A levegő a tüdőből a légcsövön keresztül jut a gégébe, amelyben a ___ helyezkednek el.","hangszalagok",null,null,"A levegő a tüdőből a légcsövön keresztül jut a gégébe, amelyben a hangszalagok helyezkednek el.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A ___ izmok segítségével állíthatjuk különféle helyzetekbe, amelyek révén befolyásolják a levegő áramlását.","hangszalagokat",null,null,"A hangszalagokat izmok segítségével állíthatjuk különféle helyzetekbe, amelyek révén befolyásolják a levegő áramlását.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A francia nyelv „orrhangú” ___ ejtése közben pedig az orr- és a szájüregen egyszerre áramlik ki levegő.","magánhangzóinak",null,null,"A francia nyelv „orrhangú” magánhangzóinak ejtése közben pedig az orr- és a szájüregen egyszerre áramlik ki levegő.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A szájüregben található ___ szervek mozgatásával különféleképpen módosítjuk a levegő áramlását.","hangképző",null,null,"A szájüregben található hangképző szervek mozgatásával különféleképpen módosítjuk a levegő áramlását.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A mássalhangzók képzésekor a hangképző szervekkel különféle akadályokat állítunk a levegő útjába, míg a ___ a szájüregben olyan szűkületet hozunk létre, amely nem akadályozza a levegő szabad kiáramlását.","magánhangzóknál",null,null,"A mássalhangzók képzésekor a hangképző szervekkel különféle akadályokat állítunk a levegő útjába, míg a magánhangzóknál a szájüregben olyan szűkületet hozunk létre, amely nem akadályozza a levegő szabad kiáramlását.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A ___ nem vékonyka szalagok vagy „szálak”, hanem vaskos izmok, amelyek a levegő áramlásának irányára merőlegesen, tehát vízszintesen helyezkednek el.","hangszalagok",null,null,"A hangszalagok nem vékonyka szalagok vagy „szálak”, hanem vaskos izmok, amelyek a levegő áramlásának irányára merőlegesen, tehát vízszintesen helyezkednek el.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A ___ elülső vége a pajzsporchoz (ádámcsutkához) tapad, hátsó végüket azonban izmok segítségével el tudjuk távolítani egymástól.","hangszalagok",null,null,"A hangszalagok elülső vége a pajzsporchoz (ádámcsutkához) tapad, hátsó végüket azonban izmok segítségével el tudjuk távolítani egymástól.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["Amikor zöngét képzünk, a ___ lazán összezárjuk, így elzárjuk a kiáramló levegő útját.","hangszalagokat",null,null,"Amikor zöngét képzünk, a hangszalagokat lazán összezárjuk, így elzárjuk a kiáramló levegő útját.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A levegő nyomása addig nő, amíg az útjában álló rugalmas ___ szét nem nyitja.","hangszalagokat",null,null,"A levegő nyomása addig nő, amíg az útjában álló rugalmas hangszalagokat szét nem nyitja.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A ___ a levegőt is rezgésbe hozza: ennek a levegőnek ezt a szabályos rezgését nevezzük zöngének.","hangszalagrezgés",null,null,"A hangszalagrezgés a levegőt is rezgésbe hozza: ennek a levegőnek ezt a szabályos rezgését nevezzük zöngének.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["Zöngétlen hangokat a ___ többféle elhelyezkedésével is létrehozhatunk.","hangszalagok",null,null,"Zöngétlen hangokat a hangszalagok többféle elhelyezkedésével is létrehozhatunk.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A legtöbb zöngétlen hangot úgy képezzük, hogy a ___ hátsó végeit eltávolítjuk egymástól, ezáltal háromszög alakú rést hozunk létre.","hangszalagok",null,null,"A legtöbb zöngétlen hangot úgy képezzük, hogy a hangszalagok hátsó végeit eltávolítjuk egymástól, ezáltal háromszög alakú rést hozunk létre.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A zöngétlen hangok többsége a szájüregben „születik” – ott állítunk akadályt a levegő útjába, amely megzavarja a levegő áramlását, ennek eredményeként jön létre a ___.","beszédhang",null,null,"A zöngétlen hangok többsége a szájüregben „születik” – ott állítunk akadályt a levegő útjába, amely megzavarja a levegő áramlását, ennek eredményeként jön létre a beszédhang.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["Ha a ___ között csak igen szűk rést hagyunk, h hangot ejtünk.","hangszalagok",null,null,"Ha a hangszalagok között csak igen szűk rést hagyunk, h hangot ejtünk.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A h nagyon halk hang; ez az oka annak, hogy több európai nyelv helyesírása is őriz olyan h betűket, amelyek egy korábbi, mára „eltűnt” h hang nyomát ___.","jelölik",null,null,"A h nagyon halk hang; ez az oka annak, hogy több európai nyelv helyesírása is őriz olyan h betűket, amelyek egy korábbi, mára „eltűnt” h hang nyomát jelölik.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A legtöbb ___ végső formáját a szájüregben, az artikuláció során alakítjuk ki.","beszédhang",null,null,"A legtöbb beszédhang végső formáját a szájüregben, az artikuláció során alakítjuk ki.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A szájüreg részeit az ajkak, a fogak, a szájpadlás, az ínyvitorla, valamint a ___ alkotják.","nyelv",null,null,"A szájüreg részeit az ajkak, a fogak, a szájpadlás, az ínyvitorla, valamint a nyelv alkotják.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["A ___ a legaktívabb szerepet a nyelv játssza.","hangképzésben",null,null,"A hangképzésben a legaktívabb szerepet a nyelv játssza.","2026. 11. 12-13. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["Kövesd a levegő útját a beszéd során, és nevezd meg a zönge forrását.","A levegő a tüdőből a légcsövön át a gégébe, majd a garat és a szájüreg vagy az orrüreg felé jut. A zönge a hangszalagok rezgésével keletkezik.",null,null,"","",true]]},{"title":"Magánhangzók","sources":[{"name":"2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx","url":null}],"qs":[["Az „ü” képzésekor az ajkak ___.","kerekítettek","résre húzottak","teljesen zártak"],["A „kor” és „kór” jelentését a magánhangzó ___ különbözteti meg.","időtartama","hangrendje","ajakkerekítése"],["A „tükör” szó magas hangrendű, ezért a megfelelő ragos alak ___.","tükörben","tükörban","tükörból","Az „ü” és az „ö” magas magánhangzó. A -ban/-ben rag magas változata illeszkedik hozzájuk."],["Az „i” és „í” hangpárban azonos az ajakműködés, de eltér a ___.","hangok időtartama","nyelvállás iránya","zöngésség","Az „i” rövid, az „í” hosszú magánhangzó."],["A nyelvek közös tulajdonsága, hogy fonémarendszerüket magánhangzók és ___ alkotják.","mássalhangzók",null,null,"A nyelvek közös tulajdonsága, hogy fonémarendszerüket magánhangzók és mássalhangzók alkotják.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Az azonban eltérő az egyes nyelvekben, hogy milyen magán- és ___ vannak, és eltérő ezek aránya.","mássalhangzóik",null,null,"Az azonban eltérő az egyes nyelvekben, hogy milyen magán- és mássalhangzóik vannak, és eltérő ezek aránya.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Egyes nyelvek (pl. a szláv nyelvek) jól „tűrik” az egymás után sorakozó ___ (ezt mutatja a horvátországi Krk sziget neve is).","mássalhangzókat",null,null,"Egyes nyelvek (pl. a szláv nyelvek) jól „tűrik” az egymás után sorakozó mássalhangzókat (ezt mutatja a horvátországi Krk sziget neve is).","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Mások (pl. a japán) erősen korlátozzák a ___.","mássalhangzó-torlódásokat",null,null,"Mások (pl. a japán) erősen korlátozzák a mássalhangzó-torlódásokat.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Másik fontos különbségük, hogy csak a ___ alkothatnak önmagukban szótagot.","magánhangzók",null,null,"Másik fontos különbségük, hogy csak a magánhangzók alkothatnak önmagukban szótagot.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Bármely nyelvben könnyen találunk olyan szavakat, amelyek csupán egy magánhangzóból álló szótagot tartalmaznak, de olyan szótagot, amely egy ___ áll, nemigen.","mássalhangzóból",null,null,"Bármely nyelvben könnyen találunk olyan szavakat, amelyek csupán egy magánhangzóból álló szótagot tartalmaznak, de olyan szótagot, amely egy mássalhangzóból áll, nemigen.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A nyelvek általában ezen kívül is különbséget tesznek a hangok e két csoportja között: gondoljunk csak arra, hogy a magyarban a határozott névelő eltérő változatait használjuk magánhangzóval, illetve ___ kezdődő szó után (pl. a ház, az épület).","mássalhangzóval",null,null,"A nyelvek általában ezen kívül is különbséget tesznek a hangok e két csoportja között: gondoljunk csak arra, hogy a magyarban a határozott névelő eltérő változatait használjuk magánhangzóval, illetve mássalhangzóval kezdődő szó után (pl. a ház, az épület).","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A magyar magánhangzó-fonémák készletének, a magyar ___ 14 tagja van.","magánhangzórendszernek",null,null,"A magyar magánhangzó-fonémák készletének, a magyar magánhangzórendszernek 14 tagja van.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A magánhangzók többnyire zöngések: ejtésükkor a ___ megrezegteti a kiáramló levegő.","hangszalagokat",null,null,"A magánhangzók többnyire zöngések: ejtésükkor a hangszalagokat megrezegteti a kiáramló levegő.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A ___ ejtésekor a nyelvünket a szájpadlásunkhoz közelítjük, de csak annyira, hogy ne akadályozzuk a levegő áramlását.","magánhangzók",null,null,"A magánhangzók ejtésekor a nyelvünket a szájpadlásunkhoz közelítjük, de csak annyira, hogy ne akadályozzuk a levegő áramlását.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A ___ négy olyan tulajdonságuk van, amelyek alapján meg tudjuk őket különböztetni egymástól.","magánhangzóknak",null,null,"A magánhangzóknak négy olyan tulajdonságuk van, amelyek alapján meg tudjuk őket különböztetni egymástól.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Ezek: a nyelv vízszintes és függőleges mozgása, az ___, valamint az időtartam.","ajakállás",null,null,"Ezek: a nyelv vízszintes és függőleges mozgása, az ajakállás, valamint az időtartam.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A nyelv vízszintes mozgása alapján különböztetjük meg egymástól a magas és mély (kevésbé régies szóval: elöl képzett és hátul képzett) ___.","magánhangzókat",null,null,"A nyelv vízszintes mozgása alapján különböztetjük meg egymástól a magas és mély (kevésbé régies szóval: elöl képzett és hátul képzett) magánhangzókat.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A két csoport közötti különbséget az adja, hogy a ___ a szájpadlás elülső (kemény) vagy hátulsó (lágy) részéhez közelítjük-e.","nyelvünket",null,null,"A két csoport közötti különbséget az adja, hogy a nyelvünket a szájpadlás elülső (kemény) vagy hátulsó (lágy) részéhez közelítjük-e.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Az elöl képzett ___ magasabbaknak tűnnek, mint a hátul képzettek, erről kapták régebbi (kissé félrevezető) elnevezésüket.","magánhangzók",null,null,"Az elöl képzett magánhangzók magasabbaknak tűnnek, mint a hátul képzettek, erről kapták régebbi (kissé félrevezető) elnevezésüket.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A nyelv függőleges mozgása szerint felső, középső, alsó és legalsó nyelvállású csoportokba soroljuk a ___.","magánhangzókat",null,null,"A nyelv függőleges mozgása szerint felső, középső, alsó és legalsó nyelvállású csoportokba soroljuk a magánhangzókat.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A szájüreg a felső ___ ejtésekor a legzártabb, a legalsó nyelvállású á ejtésekor pedig a legnyíltabb (ezért kell az orvosnál á-t és nem ú-t mondani).","nyelvállásúak",null,null,"A szájüreg a felső nyelvállásúak ejtésekor a legzártabb, a legalsó nyelvállású á ejtésekor pedig a legnyíltabb (ezért kell az orvosnál á-t és nem ú-t mondani).","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Az ajkak helyzete szerint ___ és ajakrésesek lehetnek a magánhangzók.","ajakkerekítések",null,null,"Az ajkak helyzete szerint ajakkerekítések és ajakrésesek lehetnek a magánhangzók.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Az ___ magánhangzók ejtésekor kicsit „csücsörítünk”, az ajkak kör alakot formáznak, és kicsit előretoljuk őket, míg az ajakréses magánhangzóknál lazábban nyitjuk szét az ajkainkat.","ajakkerekítéses",null,null,"Az ajakkerekítéses magánhangzók ejtésekor kicsit „csücsörítünk”, az ajkak kör alakot formáznak, és kicsit előretoljuk őket, míg az ajakréses magánhangzóknál lazábban nyitjuk szét az ajkainkat.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A magyar ___ jellemző a rövid és hosszú magánhangzók két csoportja is.","magánhangzórendszerre",null,null,"A magyar magánhangzórendszerre jellemző a rövid és hosszú magánhangzók két csoportja is.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A nyelvek egy kisebb részét – köztük a magyart, a finnt és a törököt – jellemzi az úgynevezett ___.","magánhangzó-harmónia",null,null,"A nyelvek egy kisebb részét – köztük a magyart, a finnt és a törököt – jellemzi az úgynevezett magánhangzó-harmónia.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Ez olyan szabályokat jelent, amelyek a valamilyen szempontból hasonló ___ együttes előfordulását írják elő bizonyos helyzetekben.","magánhangzók",null,null,"Ez olyan szabályokat jelent, amelyek a valamilyen szempontból hasonló magánhangzók együttes előfordulását írják elő bizonyos helyzetekben.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Kétezer éve még jóval több olyan morféma volt a magyarban, amelyek csak mély vagy csak magas ___ tartalmaztak: a hangrend jóval erősebben jellemezte a szókészletet.","magánhangzókat",null,null,"Kétezer éve még jóval több olyan morféma volt a magyarban, amelyek csak mély vagy csak magas magánhangzókat tartalmaztak: a hangrend jóval erősebben jellemezte a szókészletet.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A magyar nyelv mai állapotában már ilyen értelemben nem beszélhetünk hangrendről, ugyanis rengeteg vegyes hangrendű, mély és magas ___ egyaránt tartalmazó szótövünk van, például alig, béka, csillag, fazék, iskola, király, kópé, papír, piszok, sétál stb.","magánhangzót",null,null,"A magyar nyelv mai állapotában már ilyen értelemben nem beszélhetünk hangrendről, ugyanis rengeteg vegyes hangrendű, mély és magas magánhangzót egyaránt tartalmazó szótövünk van, például alig, béka, csillag, fazék, iskola, király, kópé, papír, piszok, sétál stb.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A példákból is látszik, hogy jócskán vannak igen régi, vegyes ___ magyar szavaink is.","hangrendű",null,null,"A példákból is látszik, hogy jócskán vannak igen régi, vegyes hangrendű magyar szavaink is.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Ma is működik viszont az illeszkedés „törvénye”: a toldalékváltozatok közül azt választjuk, amelyik megvalósítja a tő és a toldalék ___ közötti harmóniát.","magánhangzói",null,null,"Ma is működik viszont az illeszkedés „törvénye”: a toldalékváltozatok közül azt választjuk, amelyik megvalósítja a tő és a toldalék magánhangzói közötti harmóniát.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Ebből a szempontból azonban nem egyformák a szó ___.","magánhangzói",null,null,"Ebből a szempontból azonban nem egyformák a szó magánhangzói.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Elsősorban a szó utolsó ___ vesszük figyelembe, hiszen ez az, amelyik a legközelebb van a toldalékhoz.","magánhangzóját",null,null,"Elsősorban a szó utolsó magánhangzóját vesszük figyelembe, hiszen ez az, amelyik a legközelebb van a toldalékhoz.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Figyeld meg, hogy nemcsak a mély és magas, hanem többnyire a vegyes ___ szavakban is az utolsó magánhangzó határozza meg azt, hogy milyen a toldalék-magánhangzó!","hangrendű",null,null,"Figyeld meg, hogy nemcsak a mély és magas, hanem többnyire a vegyes hangrendű szavakban is az utolsó magánhangzó határozza meg azt, hogy milyen a toldalék-magánhangzó!","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Van azonban a vegyes hangrendű töveknek egy olyan csoportja is, amely mély ___ toldalékot kap.","magánhangzós",null,null,"Van azonban a vegyes hangrendű töveknek egy olyan csoportja is, amely mély magánhangzós toldalékot kap.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Ezekben a tövekben az a közös, hogy az utolsó ___ csak i, í és é (ritkán e) lehet.","magánhangzó",null,null,"Ezekben a tövekben az a közös, hogy az utolsó magánhangzó csak i, í és é (ritkán e) lehet.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A jelenséget úgy magyarázhatjuk, hogy ezek a ___ a harmónia szempontjából „gyengébbek”, mint a többi magánhangzó.","magánhangzók",null,null,"A jelenséget úgy magyarázhatjuk, hogy ezek a magánhangzók a harmónia szempontjából „gyengébbek”, mint a többi magánhangzó.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["A hangtanban ezt a „gyengeséget” semlegességnek nevezik – a semleges ___ kevésbé szólnak bele a toldalékolásba, mint a többi.","magánhangzók",null,null,"A hangtanban ezt a „gyengeséget” semlegességnek nevezik – a semleges magánhangzók kevésbé szólnak bele a toldalékolásba, mint a többi.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Ha semleges magánhangzó áll az utolsó szótagban, akkor a toldalék nem hozzá, hanem az utolsó előtti ___ igazodik.","magánhangzóhoz",null,null,"Ha semleges magánhangzó áll az utolsó szótagban, akkor a toldalék nem hozzá, hanem az utolsó előtti magánhangzóhoz igazodik.","2026. 11. 18-21. magyar nyelv 9.c,d R.-Sz.Zs..docx"],["Mutasd be a hangrendi illeszkedést a ház és a kert szóval, majd adj példát az időtartam jelentésmegkülönböztető szerepére.","Házban és kertben: a rag mély vagy magas változata illeszk mányos bukási dátuma után keleten fennmaradt a császárság.","no":"476-ban a Keletrómai Birodalom is megszűnt.","why":"395 a kettéosztáshoz, 476 a nyugati császári hatalom megszűnéséhez kapcsolódik.","activity":["Egy 500 körüli konstantinápolyi forrás császárt említ. Ellenkezik ez a 476-os évszámmal?","Nem, a keleti császárság fennmaradt","Igen, 476 után minden római állam megszűnt","Igen, Konstantinápoly Róma másik neve","A 476-os dátum a nyugati császári hatalom hagyományos végpontja."],"extraTF":["A kereszténység kialakulása és a nyugati császárság megszűnése eltérő időpontú folyamat.","A kereszténység csak a Nyugatrómai Birodalom bukása után jelent meg.","A keresztény közösségek már az első században megjelentek a birodalomban."]}]];const alternate={"Mutatkozz be angolul három mondatban. Add meg a neved, az életkorod és azt, hogy diák vagy.":"My name is Peter / I am sixteen years old / I am a student","Válaszolj teljes mondatban: Where are you from? What nationality are you?":"I come from Hungary / My nationality is Hungarian","Kérj meg egy osztálytársat, hogy nyissa ki a könyvét a tízes oldalon, majd olvassa el az első mondatot.":"Please open your book at page ten / Read the first sentence","Egy recepciós vagy. Kérdezd meg a vendég vezetéknevét, majd kérd meg, hogy betűzze.":"What is your last name / Can you spell it please","Fordítsd le: Két kulcs van a táskában, és egy esernyő van az asztal alatt.":"There are two keys in the bag / There is an umbrella under the table","A barátod ideges. Kérd meg angolul, hogy üljön le, és mondd neki, hogy ne aggódjon.":"Please sit down / Do not worry","Alakítsd tagadóvá: My brother studies English. We study French.":"My brother does not study English / We do not study French","Alkoss kérdést és rövid tagadó választ: Anna works in a hospital.":"Does Anna work in a hospital / No she does not","Kérdezz rá külön a helyre és az időre: Ben plays football in the park on Saturdays.":"Where does Ben play football / When does Ben play football","Egy mag csírázását vizsgálod. Mi a különbség a megfigyelés és a magyarázó feltevés között?":"Megfigyeléskor a tapasztalt változást rögzítem / A hipotézis ellenőrizhető magyarázat / A vízellátás hatását azonos egyéb feltételek mellett hasonlítom össze","Sorold növekvő szerveződési sorrendbe: szív, szívizomsejt, keringési rendszer, szívizomszövet.":"Először szívizomsejt / A sejtek szívizomszövetet alkotnak / A szív szerv / A keringési rendszer szervrendszer","Hasonlítsd össze az amőba, a papucsállatka és a zöld szemesostoros mozgását.":"Az amőba állábbal mozog / A papucsállatka csillókkal úszik / A szemesostoros ostorral halad","Milyen bélyegeket keresnél, ha mikroszkópos ábrán kellene felismerni egy levél fotoszintetizáló sejtjét?":"Sejtfalat keresek / A zöld színtest a fotoszintézis helye / Nagy központi vakuólumot látok","Mi történhet egy növényi sejttel tömény sóoldatban, és mi mozgatja a folyamatot?":"Ozmózissal víz távozik a sejtből / A sejtnedvüreg kisebb lesz / A sejtfalra ható nyomás csökken","Kövesd egy vízmolekula útját a talajtól a levélig.":"A víz a talajból a gyökérszőrökbe jut / A gyökérből a szár farészén halad / A levél erezetébe ér","Miért járhat együtt a gázcserenyílások zárása kisebb vízveszteséggel és lassabb fotoszintézissel?":"Záráskor kevesebb víz párolog el / Kevesebb szén-dioxid jut be / A szén-dioxid hiánya korlátozza a fotoszintézist","Helyezd sorrendbe a megtermékenyítést, a megporzást és a magképződést egy zárvatermőnél.":"Először a virágpor a bibére kerül / Ezután az ivarsejtek egyesülnek / Végül a magkezdeményből mag fejlődik","Miért más a hatékony gázcserét szolgáló hám felépítése, mint az erős mechanikai védelmet biztosító hámé?":"Az egyrétegű vékony hám rövid utat ad a gázoknak / A többrétegű hám kopás esetén is megőrzi védőrétegét","Miért nevezik a gerincesek mozgásrendszerében a vázat passzívnak, az izomzatot aktívnak?":"Az izom összehúzódva húzóerőt fejt ki / A csont támaszt és emelőkart biztosít","Különítsd el az emésztést, a felszívást és a hasznosítást egy fehérjetartalmú táplálék példáján.":"A fehérjék aminosavakra bomlanak / Az aminosavak átjutnak a bélfalon / A sejtek ezekből új fehérjéket építenek","Mi a közös a kopoltyú és a tüdő működésében, és mi a legfontosabb környezeti különbség?":"Mindkettő nagy felületű és vékony falú / A kopoltyú vízből vesz fel oxigént / A tüdő levegőből vesz fel oxigént","Magyarázd el a különbséget az artéria, a véna és a hajszálér között.":"Az artéria a szívtől elvezet / A véna a szív felé vezet / A hajszálér falán anyagok cserélődnek","Miért más folyamat az emészthetetlen maradék kiürítése és a vese kiválasztó működése?":"A kiürített táplálékmaradék a bélben maradt / A vese a vérből távolít el anyagokat / A vese szabályozza a vízháztartást","Melyik állapot jön előbb: embrió, zigóta, ivarsejt? Indokold a sorrendet.":"Először az ivarsejtek jönnek létre / Egyesülésükkel zigóta keletkezik / A zigótából osztódással embrió alakul ki","Hogyan jut el egy hormon a mirigytől a célsejthez, és miért nem válaszol rá minden sejt?":"A mirigy a hormonját a testfolyadékba juttatja / A keringés elszállítja a hormont / A célsejt megfelelő receptorral rendelkezik","Hasonlítsd össze a megszokást és a feltételes reflexet egy-egy példával.":"Megszokáskor az ismétlődő ártalmatlan ingerre gyengül a válasz / Például egy madár megszokja a zajt / Feltételes reflexben két inger társul / A kutya a táplálékot előre jelző hangra nyálat választ ki","Mi a különbség a denevér visszhangos tájékozódása és egy riasztó madárhang kommunikációs szerepe között?":"A denevér saját hangja visszaverődéséből tájékozódik / A madárhang másik állatot figyelmeztet a veszélyre","Egyenes vonalú mozgás sebesség–idő grafikonja emelkedő egyenes. Mit olvasol le a meredekségből és a görbe alatti előjeles területből?":"A meredekség a gyorsulás / Az előjeles terület az elmozdulás","Lehet-e egy futó átlagsebességének nagysága nulla egy lefutott stadionkör után? Különítsd el az utat és az elmozdulást.":"Az evaluateEssay=function(q,answer){
 if(q.models.some(m=>sameText(m,answer)))return {score:1,total:q.criteria.length,matched:[...q.criteria],missing:[],violations:[]};

 if(q.models.some(m=>sameText(m,answer))||q.i===0&&q.legacy!==undefined)return r;
 const chunks=phrases(answer),nums=numberBindings(answer);
 for(const crit of q.criteria){
  const bindings=numberBindings(crit),bad=bindings.some(([u,v])=>nums.some(([a,b])=>a===u&&Math.abs(b-v)>1e-6)&&!nums.some(([a,b])=>a===u&&Math.abs(b-v)<1e-6));

  }

}

evaluateEssay=function(d,raw){
 const v=gradingCore(d,raw);
 if(d.models.some(m=>sameText(m,raw)))return v;
 function credit(j,yes){const c=d.criteria[j];if(c===undefined)return;v.matched=v.matched.filter(t=>t!==c);v.missing=v.missing.filter(t=>t!==c);(yes?v.matched:v.missing).push(c)}

 }

 }
 if(d.i===3&&d.k===0&&d.legacy!==undefined){
 if(/don quijote|don kihote|szelmalomharc|hamlet|lenni vagy nem lenni|achilles|akhilleusz|ariadne|odussz|icarus|ikarosz|biblia|denes|romeo|romeo es julia/.test(x)&&/ide[zr]|utal|felidez|motivu|elozmeny|ismert|kapcsol|vissza/.test(x))credit(0,true);

 }
 if(d.i===4&&d.k===7&&d.legacy!==undefined){
 for(const [j,gas,n] of [[0,'h2',1],[1,'o2',2],[2,'n2',3]]){const w=['','egy','ket(?:to)?','harom'][n],re=new RegExp(gas+'[^,;.\\n]{0,12}?(?:\\b'+n+'\\b|\\b'+w+'\\b)','i');if(re.test(x))credit(j,true)}
 }
 if(d.legacy===undefined){
 const pairs=guides[d.i][d.k].pairs.slice(0,2);
 pairs.forEach(([term,def],j)=>{const useful=tokens(def);const clause=phrases(raw).find(p=>canonical(p).includes(canonical(term))&&useful.length&&useful.every(w=>tokens(p).some(y=>near(w,y)))&&neg(p)===neg(def));if(clause)credit(j,true)})
 }
 v.violations=[...new Set(v.violations)];v.score=Math.max(0,(v.matched.length-Number(v.violations.length>0))/v.total);return v
};

const gapPools=bySubject.map(rows=>[...new Set(rows.filter(d=>d.type==='gap'||d.type==='def').map(d=>d.answer))]);
function gapChoices(d){
 const a=normText(d.answer),p=normText(d.prompt);
 const compatible=v=>{const b=normText(v);return b!==a&&!b.includes(a)&&!a.includes(b)&&!p.includes(b)&&!near(a,b)};
 const local=bySubject[d.i].filter(v=>v.k===d.k&&(v.type==='gap'||v.type==='def')).map(v=>v.answer);
 // Avoid inflected forms of the same word appearing as competing answers.
 const stem=v=>normText(v).slice(0,5);
 const choices=[d.answer],roots=new Set([stem(d.answer)]);
 for(const option of [...shuffle(local),...shuffle(gapPools[d.i]),...shuffle(guides[d.i][d.k].pairs.map(x=>x[0]))]){
 if(!compatible(option)||roots.has(stem(option)))continue;choices.push(option);roots.add(stem(option));if(choices.length===3)break
 }
 return shuffle(choices)
}
function correction(d,entry){
 const res=entry.res,raw=entry.raw,parts=[];
 if(d.type==='pair'){
 d.terms.forEach((term,j)=>{if(raw[j]!==d.answer[j])parts.push(term+' jelentése: '+d.answer[j]+'. Te ehhez ezt társítottad: '+raw[j]+'.')});return parts.join(' ');
 }
 if(d.type==='many'){
 const extra=raw.filter(x=>!d.answer.includes(x)),missing=d.answer.filter(x=>!raw.includes(x));
 if(extra.length)parts.push('Tévesen jelölted: '+extra.join(' · ')+'.');if(missing.length)parts.push('Ezt is be kellett jelölni: '+missing.join(' · ')+'.');return parts.join(' ')+' '+d.why
 }
 if(d.type==='oral'){if(res.violations?.length)parts.push('Ellentmondás: '+res.violations[0]+'.');if(res.missing?.length)parts.push('Ezt a tartalmi elemet nem ismertem fel: '+res.missing[0]+'.');return parts.join(' ')||d.why}
 if(d.type==='gap'){const term=guides[d.i][d.k].pairs.find(([w])=>sameText(w,raw));return (term?'A választásod („'+raw+'”) jelentése: '+term[1]+'. ':'')+'A tananyagban ez az összefüggés szerepel: '+d.prompt.replace('___',d.answer)}
 if(d.type==='def'){const term=guides[d.i][d.k].pairs.find(([w])=>sameText(w,raw));return (term?'A választott „'+raw+'” jelentése: '+term[1]+'. ':'')+d.why}
 return d.why
}
feedback=function(d,entry){

 const why=score===1?(d.type==='oral'?res.matched.slice(0,2).join('. '):d.why):correction(d,entry);
