 Mit olvasol le a meredekségből és a görbe alatti előjeles területből?","A meredekség a gyorsulás, az időtengelyhez viszonyított előjeles terület az elmozdulás. Állandó meredekséghez állandó gyorsulás tartozik.",null,null,"","",true],["Mikor egyenlő a megtett út és az elmozdulás nagysága?","Ha a test egyenes vonalban, irányváltás nélkül halad. Az út összeadódik, az elmozdulás csak a végpontok helyzetétől függ.",null,null,"","2026.10.06.fizika.09a_MB_valtozo_mozg (1).pdf",true],["Autós útvonaltervezéshez és a helyváltozás irányának meghatározásához melyik átlagsebességet használnád?","Menetidő becsléséhez a teljes út és az idő hányadosát. A helyváltozás irányához az elmozdulásvektor és az eltelt idő hányadosát.",null,null,"","2026.10.06.fizika.09a_MB_valtozo_mozg (1).pdf",true],["Változó mozgást végez-e a biliárdgolyó, ha a falról ugyanolyan sebességnagysággal pattan vissza?","Igen. A sebesség vektor, így az irány változása akkor is sebességváltozás, ha a vektor hossza ugyanakkora marad.",null,null,"","2026.10.06.fizika.09a_MB_valtozo_mozg (1).pdf",true],["Hogyan olvasható le egy hely–idő grafikonról a pillanatnyi sebesség egy adott pillanatban?","A görbéhez az adott időpontban húzott érintő meredeksége adja az egyenes menti pillanatnyi sebességet. A negatív meredekség negatív irányú mozgást jelez.",null,null,"","2026.10.06.fizika.09a_MB_valtozo_mozg (1).pdf",true],["Milyen arányban állnak a nyugalomból, állandó gyorsulással induló test egymást követő másodpercekben megtett útjai?","1 : 3 : 5 : 7 … . A teljes út az eltelt idő négyzetével arányos, ezért az egymás utáni szakaszok a négyzetszámok különbségei. A tananyag ezt Galilei mozgásvizsgálatához köti.",null,null,"","2026.10.06.fizika.09a_MB_valtozo_mozg (1).pdf",true]]},{"title":"Mozgás körülöttünk","sources":[{"name":"2026.10.13.fizika.09a_MB_mozgas_korulottunk (1).pdf","url":null}],"qs":[["Ha egy kerékpáros 30 perc alatt 12 km-t tesz meg, átlagsebessége ___.","24 km/h","6 km/h","36 km/h"],["Egy körpályán egy teljes kör megtétele után az elmozdulás nagysága ___.","nulla","a kör kerülete","a kör sugara"],["A 72 km/h sebesség értéke SI-egységben ___.","20 m/s","25,92 m/s","259,2 m/s","A km/h-ban megadott számot 3,6-tal kell osztani."],["Egy futó 300 m-t keletre, majd 100 m-t nyugatra halad. Az út és az elmozdulás nagysága rendre ___.","400 m és 200 m","200 m és 400 m","400 m és 400 m","Az út összeadódik. Az elmozdulás a kezdőpont és a végpont különbsége."],["Egyenletesen haladva 6 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","3 km","6 km","1,5 km","s = v · 0,5 h = 3 km."],["Egy futó 360 m-t tesz meg 3 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 8 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","4 km","8 km","2 km","s = v · 0,5 h = 4 km."],["Egy futó 480 m-t tesz meg 4 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 10 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","5 km","10 km","2,5 km","s = v · 0,5 h = 5 km."],["Egy futó 600 m-t tesz meg 5 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 12 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","6 km","12 km","3 km","s = v · 0,5 h = 6 km."],["Egy futó 720 m-t tesz meg 6 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 14 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","7 km","14 km","3,5 km","s = v · 0,5 h = 7 km."],["Egy futó 840 m-t tesz meg 7 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 16 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","8 km","16 km","4 km","s = v · 0,5 h = 8 km."],["Egy futó 960 m-t tesz meg 8 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 18 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","9 km","18 km","4,5 km","s = v · 0,5 h = 9 km."],["Egy futó 1080 m-t tesz meg 9 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 20 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","10 km","20 km","5 km","s = v · 0,5 h = 10 km."],["Egy futó 1200 m-t tesz meg 10 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 22 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","11 km","22 km","5,5 km","s = v · 0,5 h = 11 km."],["Egy futó 1320 m-t tesz meg 11 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Egyenletesen haladva 24 km/h sebességgel 30 perc alatt a megtett út ___ értékű.","12 km","24 km","6 km","s = v · 0,5 h = 12 km."],["Egy futó 1440 m-t tesz meg 12 perc alatt. Átlagsebessége ___ értékű.","2 m/s","4 m/s","1 m/s","v = út / idő, az időt másodpercre váltjuk = 2 m/s."],["Lehet-e egy futó átlagsebességének nagysága nulla egy lefutott stadionkör után? Különítsd el az utat és az elmozdulást.","Az egy teljes kör alatt megtett út pozitív, ezért az út/idő szerinti átlagos sebességnagyság pozitív. A vektori átlagsebesség nulla, mert az elmozdulás nulla.",null,null,"","",true],["Pozitív vagy negatív gyorsulás jelent lassulást, ha a test a negatív tengelyirányban mozog?","Pozitív gyorsulás lassítja a negatív irányban haladó testet. A sebesség nagysága akkor csökken, ha a sebesség és a gyorsulás ellentétes irányú.",null,null,"","2026.10.13.fizika.09a_MB_mozgas_korulottunk (1).pdf",true],["Egy egyenes lejtőn felfelé gurított golyó lassul, megáll, majd visszagurul. Mit mondhatsz a gyorsulásáról ideális körülmények között?","A gyorsulás végig a lejtőn lefelé mutat, nagysága állandó lehet. A felső fordulóponton a sebesség egy pillanatra nulla, a gyorsulás ekkor is lefelé mutat a lejtő mentén.",null,null,"","2026.10.13.fizika.09a_MB_mozgas_korulottunk (1).pdf",true],["Hogyan alkalmazod a mozgások függetlenségének elvét ferde hajításnál?","Légellenállás nélkül vízszintesen egyenletes mozgás, függőlegesen állandó, lefelé irányuló gyorsulás írja le a mozgást. A két komponens ugyanannyi ideig tart, elmozdulásaik vektori összege adja a pályát.",null,null,"","2026.10.13.fizika.09a_MB_mozgas_korulottunk (1).pdf",true],["Milyen a sebesség és a gyorsulás iránya egyenletes körmozgásnál?","A sebesség a pálya érintője mentén, a gyorsulás a kör középpontja felé mutat. Merőlegesek egymásra, ezért a sebesség nagysága állandó, iránya változik.",null,null,"","2026.10.13.fizika.09a_MB_mozgas_korulottunk (1).pdf",true]]},{"title":"Newton törvényei","sources":[{"name":"2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf","url":null}],"qs":[["Egy 3 kg tömegű testre ható 12 N eredő erő gyorsulása ___.","4 m/s²","36 m/s²","0,25 m/s²"],["A hatás és ellenhatás erői ___.","különböző testekre hatnak","ugyanarra a testre hatnak","azonos irányúak"],["Egy könyv vízszintes asztalon nyugszik. A rá ható erők eredője ___.","0 N","a súlyerő kétszerese","a tömegével számszerűen azonos","A támaszerő és a gravitációs erő kiegyenlíti egymást, így nincs gyorsulás."],["Egy 2 kg-os kocsit jobbra 10 N, balra 4 N erő húz. Gyorsulása ___.","3 m/s² jobbra","7 m/s² jobbra","3 m/s² balra","Az eredő 10 − 4 = 6 N jobbra. A gyorsulás 6/2 = 3 m/s²."],["Az erő értelmezése: ___ 3. törvénye A testek csak akkor írhatóak le fizikai modellel, ha kölcsönhatásban állnak környezetükkel.","Newton",null,null,"Az erő értelmezése: Newton 3. törvénye A testek csak akkor írhatóak le fizikai modellel, ha kölcsönhatásban állnak környezetükkel.","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf · 2. oldal"],["Ezzel a jelöléssel ___ 3. törvényét így lehet ábrázolni: A Föld és egy alma kölcsönhatása Két test mechanikai kölcsönhatása során az erők mindig párosával ébrednek.","Newton",null,null,"Ezzel a jelöléssel Newton 3. törvényét így lehet ábrázolni: A Föld és egy alma kölcsönhatása Két test mechanikai kölcsönhatása során az erők mindig párosával ébrednek.","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf · 3. oldal"],["Egy pontszerű testre ható erők összegzése, ha az erők egy egyenesbe esnek Ԧ𝐹1 Ԧ𝐹2 𝛴 Ԧ𝐹𝐹1 = 300𝑁𝐹2 = −200𝑁 𝛴𝐹 = 𝐹1 + 𝐹2 = 300 − 200 = 100𝑁 Egy egyenesbe eső erők esetén nem használjuk a vektor ___.","jelölést",null,null,"Egy pontszerű testre ható erők összegzése, ha az erők egy egyenesbe esnek Ԧ𝐹1 Ԧ𝐹2 𝛴 Ԧ𝐹𝐹1 = 300𝑁𝐹2 = −200𝑁 𝛴𝐹 = 𝐹1 + 𝐹2 = 300 − 200 = 100𝑁 Egy egyenesbe eső erők esetén nem használjuk a vektor jelölést.","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf · 5. oldal"],["A gyorsulás és az erő viszonya: ___ 2. törvénye Egy pontszerű testre ható erők vektori eredője azonos irányú a test gyorsulásával, az eredő erő nagysága egyenesen arányos a test gyorsulásának nagyságával.","Newton",null,null,"A gyorsulás és az erő viszonya: Newton 2. törvénye Egy pontszerű testre ható erők vektori eredője azonos irányú a test gyorsulásával, az eredő erő nagysága egyenesen arányos a test gyorsulásának nagyságával.","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf · 6. oldal"],["Fogalmazza meg ___ 0. törvényét szövegesen! 2.","Newton",null,null,"Fogalmazza meg Newton 0. törvényét szövegesen! 2.","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf · 10. oldal"],["Fogalmazza meg ___ 1. törvényét szövegesen a Σ Ԧ𝐹 = 0 ⟺ Ԧ𝑣 = á𝑙𝑙𝑎𝑛𝑑ó képlet alapján! 3.","Newton",null,null,"Fogalmazza meg Newton 1. törvényét szövegesen a Σ Ԧ𝐹 = 0 ⟺ Ԧ𝑣 = á𝑙𝑙𝑎𝑛𝑑ó képlet alapján! 3.","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf · 10. oldal"],["Fogalmazza meg ___ 2. törvényét szövegesen a Σ Ԧ𝐹 = 𝑚 ∙ 𝑎 képlet alapján! 4.","Newton",null,null,"Fogalmazza meg Newton 2. törvényét szövegesen a Σ Ԧ𝐹 = 𝑚 ∙ 𝑎 képlet alapján! 4.","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf · 10. oldal"],["Fogalmazza meg ___ 3. törvényét szövegesen az ábra alapján! 5.","Newton",null,null,"Fogalmazza meg Newton 3. törvényét szövegesen az ábra alapján! 5.","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf · 10. oldal"],["Egy 4 kg-os test 2 m/s² gyorsulásához szükséges eredő erő ___ értékű.","8 N","16 N","4 N","F = m · a = 8 N."],["Egy testet 8 N eredő erő 2 m/s² gyorsulással mozgat. A test tömege ___ értékű.","4 kg","8 kg","2 kg","m = F / a = 4 kg."],["Egy 5 kg-os test 3 m/s² gyorsulásához szükséges eredő erő ___ értékű.","15 N","30 N","7,5 N","F = m · a = 15 N."],["Egy testet 15 N eredő erő 3 m/s² gyorsulással mozgat. A test tömege ___ értékű.","5 kg","10 kg","2,5 kg","m = F / a = 5 kg."],["Egy 6 kg-os test 4 m/s² gyorsulásához szükséges eredő erő ___ értékű.","24 N","48 N","12 N","F = m · a = 24 N."],["Egy testet 24 N eredő erő 4 m/s² gyorsulással mozgat. A test tömege ___ értékű.","6 kg","12 kg","3 kg","m = F / a = 6 kg."],["Egy 7 kg-os test 5 m/s² gyorsulásához szükséges eredő erő ___ értékű.","35 N","70 N","17,5 N","F = m · a = 35 N."],["Egy testet 35 N eredő erő 5 m/s² gyorsulással mozgat. A test tömege ___ értékű.","7 kg","14 kg","3,5 kg","m = F / a = 7 kg."],["Egy 8 kg-os test 6 m/s² gyorsulásához szükséges eredő erő ___ értékű.","48 N","96 N","24 N","F = m · a = 48 N."],["Egy testet 48 N eredő erő 6 m/s² gyorsulással mozgat. A test tömege ___ értékű.","8 kg","16 kg","4 kg","m = F / a = 8 kg."],["Egy 9 kg-os test 7 m/s² gyorsulásához szükséges eredő erő ___ értékű.","63 N","126 N","31,5 N","F = m · a = 63 N."],["Egy testet 63 N eredő erő 7 m/s² gyorsulással mozgat. A test tömege ___ értékű.","9 kg","18 kg","4,5 kg","m = F / a = 9 kg."],["Egy 10 kg-os test 8 m/s² gyorsulásához szükséges eredő erő ___ értékű.","80 N","160 N","40 N","F = m · a = 80 N."],["Egy testet 80 N eredő erő 8 m/s² gyorsulással mozgat. A test tömege ___ értékű.","10 kg","20 kg","5 kg","m = F / a = 10 kg."],["Egy 11 kg-os test 9 m/s² gyorsulásához szükséges eredő erő ___ értékű.","99 N","198 N","49,5 N","F = m · a = 99 N."],["Egy testet 99 N eredő erő 9 m/s² gyorsulással mozgat. A test tömege ___ értékű.","11 kg","22 kg","5,5 kg","m = F / a = 11 kg."],["Egy 12 kg-os test 10 m/s² gyorsulásához szükséges eredő erő ___ értékű.","120 N","240 N","60 N","F = m · a = 120 N."],["Egy testet 120 N eredő erő 10 m/s² gyorsulással mozgat. A test tömege ___ értékű.","12 kg","24 kg","6 kg","m = F / a = 12 kg."],["Egy 13 kg-os test 11 m/s² gyorsulásához szükséges eredő erő ___ értékű.","143 N","286 N","71,5 N","F = m · a = 143 N."],["Egy testet 143 N eredő erő 11 m/s² gyorsulással mozgat. A test tömege ___ értékű.","13 kg","26 kg","6,5 kg","m = F / a = 13 kg."],["Miért nem oltja ki egymást Newton harmadik törvényének erőpárja egyetlen test mozgásegyenletében?","Az erő és az ellenerő külön testre hat. Egy adott test gyorsulását csak az arra a testre ható erők eredője adja meg.",null,null,"","",true],["Mit nevez a lecke Newton „nulladik törvényének”?","Az ugyanarra a testre ható erők hatását az erővektorok összege, az eredő erő adja. Egy egyenesbe eső erők előjelesen összeadhatók, eltérő irányoknál vektori összegzést végzünk.",null,null,"","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf",true],["Melyik mozgásállapot marad fenn, ha a testre ható erők eredője nulla?","Inerciarendszerben a sebességvektor állandó. A test nyugalomban marad, vagy egyenes vonalú egyenletes mozgást végez.",null,null,"","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf",true],["Hogyan képezhető az azonos irányú eredő erő a gyorsulásból?","Állandó tömeg esetén az eredő erő a tömeg és a gyorsulásvektor szorzata. A gyorsulás megduplázásához azonos tömegnél kétszeres eredő szükséges.",null,null,"","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf",true],["Mi az erő támadáspontja és hatásvonala? Miért számítanak egy merev testnél?","A támadáspont az erőhatás helye. A hatásvonal a támadásponton átmenő, az erő irányába mutató egyenes. Adott forgástengelyre a hatásvonal távolsága is befolyásolja a forgatónyomatékot.",null,null,"","2026.10.20.fizika.09a_MB_Newton_torvenyek (1).pdf",true]]},{"title":"Tömegvonzás és súly","sources":[{"name":"2026.11.03fizika.09a_MB_tomegvonzas_suly.pdf","url":null}],"qs":[["Két pontszerű test távolságát megduplázva a köztük ható gravitációs erő ___.","negyedére csökken","felére csökken","kétszeresére nő"],["Nyugvó mérlegen egy 5 kg-os test súlya közelítőleg ___ (g ≈ 10 m/s²).","50 N","5 N","0,5 N"],["A Holdra vitt hátizsák tömege ___.","ugyanannyi marad","a hatodára csökken","nullára csökken","A tömeg a test tulajdonsága. A kisebb holdi gravitáció a súlyát változtatja meg."],["Az egyik pontszerű test tömegét megkétszerezzük, a másik tömeg és a távolság változatlan. A vonzóerő ___.","kétszeres lesz","négyszeres lesz","feleakkora lesz","A gravitációs erő egyenesen arányos mindkét tömeggel."],["Kölcsönhatások és erőtörvények A Newton-féle mechanikus világkép alapja, hogy a Világegyetem egy „gépezet”, melynek építőelemei (elemi részecskék) a ___ megfelelően mozognak, a rájuk ható erők pedig a kölcsönhatások eredményei.","Newton-törvényeknek",null,null,"Kölcsönhatások és erőtörvények A Newton-féle mechanikus világkép alapja, hogy a Világegyetem egy „gépezet”, melynek építőelemei (elemi részecskék) a Newton-törvényeknek megfelelően mozognak, a rájuk ható erők pedig a kölcsönhatások eredményei.","2026.11.03fizika.09a_MB_tomegvonzas_suly.pdf · 4. oldal"],["Modell: a Föld sík, függőleges a gravitáció, nincs közegellenállás A Föld légkörén kívül körpályán ___ test.","keringő",null,null,"Modell: a Föld sík, függőleges a gravitáció, nincs közegellenállás A Föld légkörén kívül körpályán keringő test.","2026.11.03fizika.09a_MB_tomegvonzas_suly.pdf · 9. oldal"],["Nyugalomban függő 4 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","40 N","80 N","20 N","G = m · g = 40 N."],["Nyugalomban függő 5 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","50 N","100 N","25 N","G = m · g = 50 N."],["Nyugalomban függő 6 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","60 N","120 N","30 N","G = m · g = 60 N."],["Nyugalomban függő 7 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","70 N","140 N","35 N","G = m · g = 70 N."],["Nyugalomban függő 8 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","80 N","160 N","40 N","G = m · g = 80 N."],["Nyugalomban függő 9 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","90 N","180 N","45 N","G = m · g = 90 N."],["Nyugalomban függő 10 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","100 N","200 N","50 N","G = m · g = 100 N."],["Nyugalomban függő 11 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","110 N","220 N","55 N","G = m · g = 110 N."],["Nyugalomban függő 12 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","120 N","240 N","60 N","G = m · g = 120 N."],["Nyugalomban függő 13 kg tömegű test súlya a Földön (g = 10 m/s²) ___ értékű.","130 N","260 N","65 N","G = m · g = 130 N."],["Mi a különbség a gravitációs erő és aközött az erő között, amellyel a test az alátámasztását nyomja?","A gravitációs erőt a Föld fejti ki a testre. A súly az az erő, amellyel a test az alátámasztását nyomja vagy a felfüggesztését húzza. Szabadesésben a súly nulla lehet, miközben a gravitációs erő hat.",null,null,"","",true],["A Föld és az alma közül melyik fejt ki nagyobb gravitációs erőt a másikra? Miért látjuk mégis az almát esni?","Az erők nagysága egyenlő, irányuk ellentétes. Ugyanakkora erő mellett az alma gyorsulása sokkal nagyobb, mert a tömege jóval kisebb.",null,null,"","2026.11.03fizika.09a_MB_tomegvonzas_suly.pdf",true],["Mit érzékel egy fürdőszobai mérleg, és mikor felel meg a kijelzett kilogrammérték a test tömegének?","A mérleget nyomó erő hatását érzékeli. A kilogrammskála a helyi nehézségi gyorsulással számol. Nyugalomban vagy állandó sebességű függőleges mozgásnál a kijelzett érték megfelelhet a tömegnek.",null,null,"","2026.11.03fizika.09a_MB_tomegvonzas_suly.pdf",true],["Egy 60 kg tömegű emberrel a lift felfelé gyorsul 2 m/s²-tel. Mekkora a támaszerő, ha g = 10 m/s²?","N − mg = ma, tehát N = m(g + a) = 60 · 12 = 720 N. Az ember ugyanekkora erővel nyomja a mérleget.",null,null,"","2026.11.03fizika.09a_MB_tomegvonzas_suly.pdf",true],["Miért tapasztal súlytalanságot a Föld körül keringő űrhajós?","Az űrhajó és az űrhajós együtt esik a Föld gravitációs terében. Az űrhajósnak nincs szüksége az alátámasztás nyomóerejére, jóllehet a gravitáció gyorsítja.",null,null,"","2026.11.03fizika.09a_MB_tomegvonzas_suly.pdf",true]]},{"title":"Rugóerő és súrlódás","sources":[{"name":"2026.11.10.fizika.09a_MB_rugoero_surlodas.pdf","url":null}],"qs":[["Egy 200 N/m rugóállandójú rugó 0,03 m-es megnyúlásánál a rugóerő nagysága ___.","6 N","60 N","0,6 N"],["A csúszási súrlódási erő iránya az érintkező felületek egymáshoz viszonyított csúszásával ___.","ellentétes","azonos","mindig függőleges"],["Egy rugó 4 N hatására 2 cm-t nyúlik. A rugóállandó ___.","200 N/m","2 N/m","0,5 N/m","A megnyúlás 0,02 m, így k = 4/0,02 = 200 N/m."],["A csúszási súrlódási együttható 0,2, a nyomóerő 50 N. A súrlódási erő nagysága ___.","10 N","250 N","50,2 N","A csúszási súrlódási erő 0,2 · 50 N = 10 N."],["A rugóállandó 300 N/m. A rugót 1 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","3 N","6 N","1,5 N","F = k · Δl, a megnyúlás méterben értendő = 3 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 40 N. A csúszási súrlódási erő ___ értékű.","12 N","24 N","6 N","F = μ · N = 12 N."],["A rugóállandó 400 N/m. A rugót 2 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","8 N","16 N","4 N","F = k · Δl, a megnyúlás méterben értendő = 8 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 50 N. A csúszási súrlódási erő ___ értékű.","15 N","30 N","7,5 N","F = μ · N = 15 N."],["A rugóállandó 500 N/m. A rugót 3 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","15 N","30 N","7,5 N","F = k · Δl, a megnyúlás méterben értendő = 15 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 60 N. A csúszási súrlódási erő ___ értékű.","18 N","36 N","9 N","F = μ · N = 18 N."],["A rugóállandó 600 N/m. A rugót 4 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","24 N","48 N","12 N","F = k · Δl, a megnyúlás méterben értendő = 24 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 70 N. A csúszási súrlódási erő ___ értékű.","21 N","42 N","10,5 N","F = μ · N = 21 N."],["A rugóállandó 700 N/m. A rugót 5 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","35 N","70 N","17,5 N","F = k · Δl, a megnyúlás méterben értendő = 35 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 80 N. A csúszási súrlódási erő ___ értékű.","24 N","48 N","12 N","F = μ · N = 24 N."],["A rugóállandó 800 N/m. A rugót 6 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","48 N","96 N","24 N","F = k · Δl, a megnyúlás méterben értendő = 48 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 90 N. A csúszási súrlódási erő ___ értékű.","27 N","54 N","13,5 N","F = μ · N = 27 N."],["A rugóállandó 900 N/m. A rugót 7 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","63 N","126 N","31,5 N","F = k · Δl, a megnyúlás méterben értendő = 63 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 100 N. A csúszási súrlódási erő ___ értékű.","30 N","60 N","15 N","F = μ · N = 30 N."],["A rugóállandó 1000 N/m. A rugót 8 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","80 N","160 N","40 N","F = k · Δl, a megnyúlás méterben értendő = 80 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 110 N. A csúszási súrlódási erő ___ értékű.","33 N","66 N","16,5 N","F = μ · N = 33 N."],["A rugóállandó 1100 N/m. A rugót 9 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","99 N","198 N","49,5 N","F = k · Δl, a megnyúlás méterben értendő = 99 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 120 N. A csúszási súrlódási erő ___ értékű.","36 N","72 N","18 N","F = μ · N = 36 N."],["A rugóállandó 1200 N/m. A rugót 10 cm-rel nyújtjuk meg. A rugóerő nagysága ___ értékű.","120 N","240 N","60 N","F = k · Δl, a megnyúlás méterben értendő = 120 N."],["A csúszási súrlódási együttható 0,3. A felületre merőleges nyomóerő 130 N. A csúszási súrlódási erő ___ értékű.","39 N","78 N","19,5 N","F = μ · N = 39 N."],["Egy rugó 5 N terhelésre 1 cm-t nyúlik. Mennyi a rugóállandó és a várható megnyúlás 15 N-nál?","k = 5 / 0,01 = 500 N/m. A rugalmas, lineáris tartományban 15 / 500 = 0,03 m, vagyis 3 cm.",null,null,"","",true],["Mit jelent a mínuszjel a rugóerő F = −Dx összefüggésében?","Az egyensúlyi helyzethez viszonyított kitérés és a rugó által kifejtett visszatérítő erő ellentétes irányú. A lineáris rugalmas tartományban az erő nagysága arányos a kitérés nagyságával.",null,null,"","2026.11.10.fizika.09a_MB_rugoero_surlodas.pdf",true],["Mikor mondjuk egy alakváltozásra, hogy rugalmas? Adj hosszanti és csavarási példát.","A terhelés megszűnése után a test visszanyeri eredeti alakját. Példa a mérsékelten megnyújtott rugó és a rugalmas tartományban elcsavart szál.",null,null,"","2026.11.10.fizika.09a_MB_rugoero_surlodas.pdf",true],["Egy hasábot ugyanazon a lapon a nagyobb, majd kisebb oldalára fordítva húzunk. Mit jósol az egyszerű csúszási súrlódási modell?","Azonos nyomóerő és súrlódási együttható mellett a súrlódási erő azonos. A modellben a látszólagos érintkező felület nagysága és a csúszási sebesség nem külön tényező.",null,null,"","2026.11.10.fizika.09a_MB_rugoero_surlodas.pdf",true]]},{"title":"Tapadás, gördülés és közegellenállás","sources":[{"name":"2026.11.17.fizika.09a_MB_tap_gordul_kozegell.pdf","url":null}],"qs":[["A talajon csúszás nélkül gördülő, hajtott kerékre a talaj ___ erőt fejthet ki az érintkezési pontban.","tapadási súrlódási","csúszási súrlódási","közegellenállási"],["Az ejtőernyő kinyitásakor adott sebességnél megnő a(z) ___.","közegellenállás","test tömege","gravitációs gyorsulás"],["A levegőhöz képest lefelé eső labdára a közegellenállás ___ hat.","felfelé","lefelé","mindig vízszintesen","A közegellenállás a közeghez viszonyított sebességgel ellentétes irányú."],["Egy vízszintes talajon álló ládát 8 N vízszintes erővel tolsz, de nem mozdul. Más vízszintes erő híján a tapadási súrlódás nagysága ___.","8 N","0 N","mindig a láda súlyával egyező","A nyugvó láda eredő ereje nulla. A tapadási súrlódás a határáig felveszi a szükséges értéket."],["Egy 4 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","40 N","80 N","20 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 40 N."],["Egy 5 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","50 N","100 N","25 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 50 N."],["Egy 6 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","60 N","120 N","30 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 60 N."],["Egy 7 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","70 N","140 N","35 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 70 N."],["Egy 8 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","80 N","160 N","40 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 80 N."],["Egy 9 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","90 N","180 N","45 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 90 N."],["Egy 10 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","100 N","200 N","50 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 100 N."],["Egy 11 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","110 N","220 N","55 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 110 N."],["Egy 12 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","120 N","240 N","60 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 120 N."],["Egy 13 kg-os test állandó sebességgel zuhan. A közegellenállás nagysága (g = 10 m/s²) ___ értékű.","130 N","260 N","65 N","Egyenletes mozgásnál az eredő nulla, így F = m · g = 130 N."],["Miért nem kell mindig a maximális tapadási súrlódási erővel számolni?","A tapadási súrlódás a relatív elcsúszást akadályozza, és a szükséges értékre áll be a határáig. A μ·N érték a felső határ.",null,null,"","",true],["Milyen irányban hat a tapadási súrlódás a gyorsuló szállítószalagon lévő, vele együtt mozgó csomagra?","A szalag gyorsulásának irányába is hathat. A tapadás a két felület egymáson való megcsúszását akadályozza, ezért nem szükségszerűen ellentétes a csomag haladásával.",null,null,"","2026.11.17.fizika.09a_MB_tap_gordul_kozegell.pdf",true],["Hogyan változik a legnagyobb tapadási erő, ha a nyomóerő felére csökken, miközben az együttható változatlan?","Fmax = μ₀N, ezért a legnagyobb tapadási erő is felére csökken. A tényleges tapadási erő ennél kisebb is lehet.",null,null,"","2026.11.17.fizika.09a_MB_tap_gordul_kozegell.pdf",true],["Miért más a blokkolt és a csúszás nélkül gördülő kerék viselkedése erős fékezésnél?","Blokkoláskor a felülethez képest csúszás lép fel. Tapadásnál a kerék az adott gumi–út párosra jellemző nagyobb határerőig adhat át erőt, és jobban megőrizhető a kormányozhatóság.",null,null,"","2026.11.17.fizika.09a_MB_tap_gordul_kozegell.pdf",true],["A tananyag négyzetes közegellenállási modelljében mire vezet a relatív sebesség kétszerezése? Mely további tényezők számítanak?","Az ellenállás négyszeres lesz. F = ½·k·ρ·A·v², így számít a közeg sűrűsége, a homlokfelület és a test alakját jellemző tényező is.",null,null,"","2026.11.17.fizika.09a_MB_tap_gordul_kozegell.pdf",true],["Miért lassulhat egy szabadon gördülő kerék akkor is, ha az érintkezési pontban nem csúszik?","A kerék és az aljzat alakváltozása gördülési ellenálláshoz és energiaveszteséghez vezethet. Ez különbözik a két felület csúszási súrlódásától.",null,null,"","2026.11.17.fizika.09a_MB_tap_gordul_kozegell.pdf",true]]},{"title":"Eötvös-mérés és gravitáció","sources":[{"name":"Eötvös mérés.pdf","url":null}],"qs":[["Eötvös Loránd gravitációs méréseinek nevezetes eszköze a ___.","torziós inga","rugós hőmérő","folyadékbarométer"],["A torziós ingában a felfüggesztő szál ___ jelzi a forgatóhatást.","elcsavarodása","megolvadása","hőtágulása"],["A torziós inga egyensúlyában a szál visszatérítő forgatónyomatéka a külső forgatónyomatékot ___.","kiegyenlíti","megkétszerezi","mindig azonos irányban növeli","Az egyensúly feltétele, hogy a forgatónyomatékok összege nulla legyen."],["Ha a mérési eredmények szóródnak, több független mérés átlaga a ___ hatását mérsékelheti.","véletlen mérési hibák","minden rendszeres hiba","helytelen mértékegység megadásának","Az átlagolás csökkentheti a véletlen ingadozást. A hibásan beállított nulla rendszeres eltérést okozhat."],["Később ___ és Bessel már kimondottan a súlyos és tehetetlen tömeg ekvivalenciáját tesztelték különféle ingákkal végzett kísérletekben.","Newton",null,null,"Később Newton és Bessel már kimondottan a súlyos és tehetetlen tömeg ekvivalenciáját tesztelték különféle ingákkal végzett kísérletekben.","Eötvös mérés.pdf · 1. oldal"],["Ez a vonzóerő a jól ismert ___ -féle általános tömegvonzási (gravitációs) erő, melynek nagysága szintén arányos a testre jellemző mennyiséggel, a súlyos tömeggel.","Newton",null,null,"Ez a vonzóerő a jól ismert Newton -féle általános tömegvonzási (gravitációs) erő, melynek nagysága szintén arányos a testre jellemző mennyiséggel, a súlyos tömeggel.","Eötvös mérés.pdf · 1. oldal"],["___ óta a fizika kiemelt kérdése, hogy a két tömeg valójában ugyanaz-e, vagy más-más mennyiséget jelöl.","Newton",null,null,"Newton óta a fizika kiemelt kérdése, hogy a két tömeg valójában ugyanaz-e, vagy más-más mennyiséget jelöl.","Eötvös mérés.pdf · 1. oldal"],["Galilei legendás ejtési kísérlete a pisai ferde toronyban Különböző tömegek között a ___ -féle általános tömegvonzási erő ( F) hat, amelynek nagysága arányos a Föld M és az ejtett próbatest ms súlyos tömegével és fordítva arányos a tömegközéppontjaik közötti R távolság négyzetével.","Newton",null,null,"Galilei legendás ejtési kísérlete a pisai ferde toronyban Különböző tömegek között a Newton -féle általános tömegvonzási erő ( F) hat, amelynek nagysága arányos a Föld M és az ejtett próbatest ms súlyos tömegével és fordítva arányos a tömegközéppontjaik közötti R távolság négyzetével.","Eötvös mérés.pdf · 1. oldal"],["Ugyanakkor ___ II. törvénye értelmében a testek erő hatására gyorsuló mozgást végeznek, az a gyorsulás arányos a tömegre ható F erővel és fordítottan arányos a test mt tehetetlen tömegével.","Newton",null,null,"Ugyanakkor Newton II. törvénye értelmében a testek erő hatására gyorsuló mozgást végeznek, az a gyorsulás arányos a tömegre ható F erővel és fordítottan arányos a test mt tehetetlen tömegével.","Eötvös mérés.pdf · 1. oldal"],["Eötvös ___, hogy az F c forgási centrifugális erő független az anyagi minőségtől, az FT tömegvonzási erő viszont függhet tőle.","feltételezte",null,null,"Eötvös feltételezte, hogy az F c forgási centrifugális erő független az anyagi minőségtől, az FT tömegvonzási erő viszont függhet tőle.","Eötvös mérés.pdf · 2. oldal"],["A ___ szerint mindkét testre azonos F c forgási centrifugális tehetetlenségi erő hat, viszont a Föld az m tömegre FT, míg az m’ tömegre FT’ gravitációs erőt gyakorol.","feltételezés",null,null,"A feltételezés szerint mindkét testre azonos F c forgási centrifugális tehetetlenségi erő hat, viszont a Föld az m tömegre FT, míg az m’ tömegre FT’ gravitációs erőt gyakorol.","Eötvös mérés.pdf · 2. oldal"],["Később, 1986-ban Fischbach és munkatársai az említett eltéréseket vizsgálva arra a következtetésre jutottak, hogy ezek nem teljesen véletlenszerűek, hanem az ___ kötési energiájának lineáris függvényeként írhatók fel, és felvetették egy rövid hatótávolságú, úgynevezett ötödik erő létezését [4].","atommagok",null,null,"Később, 1986-ban Fischbach és munkatársai az említett eltéréseket vizsgálva arra a következtetésre jutottak, hogy ezek nem teljesen véletlenszerűek, hanem az atommagok kötési energiájának lineáris függvényeként írhatók fel, és felvetették egy rövid hatótávolságú, úgynevezett ötödik erő létezését [4].","Eötvös mérés.pdf · 3. oldal"],["Az ötödik erő szerintük a gravitációnál lényegesen gyengébb, a barionok (protonok és ___) számával arányos, és hatótávolsága néhány tíz vagy száz méter.","neutronok",null,null,"Az ötödik erő szerintük a gravitációnál lényegesen gyengébb, a barionok (protonok és neutronok) számával arányos, és hatótávolsága néhány tíz vagy száz méter.","Eötvös mérés.pdf · 3. oldal"],["A ___ komoly vitákat váltott ki, és további méréseket és ellenőrző kísérleteket motivált.","feltételezés",null,null,"A feltételezés komoly vitákat váltott ki, és további méréseket és ellenőrző kísérleteket motivált.","Eötvös mérés.pdf · 3. oldal"],["Dicke és munkatársai északdél tájolású ingával a Nap tömegvonzása és a Föld ___ adódó keringési centrifugális erő viszonyának anyagfüggését m érték, aminek előnye, hogy az ingát, a jel 24 órás periodicitása miatt a mérés során nem kellett forgatni.","keringéséből",null,null,"Dicke és munkatársai északdél tájolású ingával a Nap tömegvonzása és a Föld keringéséből adódó keringési centrifugális erő viszonyának anyagfüggését m érték, aminek előnye, hogy az ingát, a jel 24 órás periodicitása miatt a mérés során nem kellett forgatni.","Eötvös mérés.pdf · 3. oldal"],["Utóbbi probléma egyszerűen kezelhető megfelelő mérési helyszín ___ és a gradiensek pontos meghatározásával a műszer környezetében.","kiválasztásával",null,null,"Utóbbi probléma egyszerűen kezelhető megfelelő mérési helyszín kiválasztásával és a gradiensek pontos meghatározásával a műszer környezetében.","Eötvös mérés.pdf · 3. oldal"],["Megfelelő helyszín ___ biztosítható a környezeti hőmérséklet stabilitása és csökkenthetők az elsősorban forgalom okozta talajrezgések is.","kiválasztásával",null,null,"Megfelelő helyszín kiválasztásával biztosítható a környezeti hőmérséklet stabilitása és csökkenthetők az elsősorban forgalom okozta talajrezgések is.","Eötvös mérés.pdf · 3. oldal"],["Három szögkitérés rendre 2°, 3° és 4°. A számtani átlag ___ értékű.","3 °","6 °","1,5 °","Átlag = a három érték összege / 3 = 3 °."],["Három szögkitérés rendre 3°, 4° és 5°. A számtani átlag ___ értékű.","4 °","8 °","2 °","Átlag = a három érték összege / 3 = 4 °."],["Három szögkitérés rendre 4°, 5° és 6°. A számtani átlag ___ értékű.","5 °","10 °","2,5 °","Átlag = a három érték összege / 3 = 5 °."],["Három szögkitérés rendre 5°, 6° és 7°. A számtani átlag ___ értékű.","6 °","12 °","3 °","Átlag = a három érték összege / 3 = 6 °."],["Három szögkitérés rendre 6°, 7° és 8°. A számtani átlag ___ értékű.","7 °","14 °","3,5 °","Átlag = a három érték összege / 3 = 7 °."],["Három szögkitérés rendre 7°, 8° és 9°. A számtani átlag ___ értékű.","8 °","16 °","4 °","Átlag = a három érték összege / 3 = 8 °."],["Három szögkitérés rendre 8°, 9° és 10°. A számtani átlag ___ értékű.","9 °","18 °","4,5 °","Átlag = a három érték összege / 3 = 9 °."],["Három szögkitérés rendre 9°, 10° és 11°. A számtani átlag ___ értékű.","10 °","20 °","5 °","Átlag = a három érték összege / 3 = 10 °."],["Három szögkitérés rendre 10°, 11° és 12°. A számtani átlag ___ értékű.","11 °","22 °","5,5 °","Átlag = a három érték összege / 3 = 11 °."],["Három szögkitérés rendre 11°, 12° és 13°. A számtani átlag ___ értékű.","12 °","24 °","6 °","Átlag = a három érték összege / 3 = 12 °."],["Hogyan különítenéd el egy mérésben a véletlen szóródást az állandó nullponthibától?","Ismételt mérésekkel becsülhető a szóródás. Ismert referencia vagy nullhelyzet ellenőrzése mutathatja ki a tartós eltolódást. Az átlagolás önmagában a nullponthibát nem javítja ki.",null,null,"","",true],["Mit vizsgált Eötvös a súlyos és a tehetetlen tömeg összehasonlításával?","Azt, hogy arányuk függ-e az anyagi minőségtől. Ha különböző anyagoknál az arány azonos, akkor azonos gravitációs térben azonos szabadesési gyorsulást várunk.",null,null,"","Eötvös mérés.pdf",true],["Miért használtak eltérő összetételű próbatesteket, például platinát és faanyagot?","Az anyagfüggő különbséget csak eltérő összetételű testek összehasonlításával lehet keresni. A vizsgálat célja az esetleges eltérés kimutatása vagy felső korlátjának szűkítése.",null,null,"","Eötvös mérés.pdf",true],["Sorolj fel három hibaforrást, amelyet maga a leolvasó személy okozhat az érzékeny ingánál.","A személy tömegvonzása megváltoztathatja az egyensúlyi helyzetet, testmelege módosíthatja a hőmérsékleti viszonyokat, mozgása pedig talajrezgést kelthet.",null,null,"","Eötvös mérés.pdf",true],["Mi a CCD-érzékelővel történő távoli leolvasás két előnye a tananyag szerint?","Csökkenti a közvetlen emberi jelenlét okozta zavarokat. Sok egymás utáni képből követhető a csillapodás, és pontosabban becsülhető az egyensúlyi helyzet.",null,null,"","Eötvös mérés.pdf",true],["Miért kellett a távvezérelt forgatóegységnek hirtelen indulás és fékezés nélkül működnie?","Az ingát több mérési irányba kell állítani. A hirtelen gyorsítás mechanikai lökést és rezgést adna át az érzékeny szerkezetnek, amely megzavarná a beállást és a leolvasást.",null,null,"","Eötvös mérés.pdf",true]]}]},{"name":"Irodalom","icon":"¶","desc":"Műnemek, mítoszok és antik művek","topics":[{"title":"Intertextualitás","sources":[{"name":"2026.09. 09-12. magyar irodalom 9.a, c,d R.-Sz.Zs..docx","url":null}],"qs":[["Ha egy mű egy korábbi mű szövegét idézi vagy átírja, a kapcsolat neve ___.","intertextualitás","alliteráció","enjambement"],["Egy ismert verssor humoros átírásának felismerésében elsősorban ___ segít.","az eredeti mű ismerete","a kiadás lapszáma","a sorvégi írásjel"],["Egy költő szó szerint beilleszt egy ismert sort elődje verséből. A kapcsolat legpontosabb megnevezése ___.","idézet","megszemélyesítés","ütemhangsúly","Az idézet egy másik szöveg felismerhető, szó szerinti átvétele."],["Egy új mű csak a „lenni vagy nem lenni” fordulattal utal Hamlet vívódására. Az olvasónak ez az utalás ___ segít felidézni.","a korábbi szöveg jelentéskörét","a nyomtatás pontos évét","a kiadó székhelyét","Az utalás összekapcsolja az új szöveghelyet a felidézett művel."],["Az ___, tehát szövegközti hasonlóságokat mutató művek párhuzama többféle lehet: megfigyelhetünk közöttük többek között motivikus, műfaji, műnemi, képi, kifejezésbeli, tartalmi és gondolati kapcsolatokat.","intertextuális",null,null,"Az intertextuális, tehát szövegközti hasonlóságokat mutató művek párhuzama többféle lehet: megfigyelhetünk közöttük többek között motivikus, műfaji, műnemi, képi, kifejezésbeli, tartalmi és gondolati kapcsolatokat.","2026.09. 09-12. magyar irodalom 9.a, c,d R.-Sz.Zs..docx"],["Az ___ jelenséget felmutató irodalmi alkotások szükségképpen magukban hordozzák a kiindulópontként használt, eredeti szöveg(ek) egy-egy üzenetét is.","intertextuális",null,null,"Az intertextuális jelenséget felmutató irodalmi alkotások szükségképpen magukban hordozzák a kiindulópontként használt, eredeti szöveg(ek) egy-egy üzenetét is.","2026.09. 09-12. magyar irodalom 9.a, c,d R.-Sz.Zs..docx"],["Ebbe a folyamatba azonban nemcsak az alkotók, hanem a befogadók is bekapcsolódhatnak: a szövegköztiség jelenségének és ___ felismerése ugyanis olvasottságuk és irodalmi ismereteik függvénye.","jelentéstöbbletének",null,null,"Ebbe a folyamatba azonban nemcsak az alkotók, hanem a befogadók is bekapcsolódhatnak: a szövegköztiség jelenségének és jelentéstöbbletének felismerése ugyanis olvasottságuk és irodalmi ismereteik függvénye.","2026.09. 09-12. magyar irodalom 9.a, c,d R.-Sz.Zs..docx"],["Hiszen minél nagyobb mértékű szövegtudással rendelkeznek, annál többet képesek megérteni az ___ műalkotások egymásra rakódott üzeneteiből.","intertextuális",null,null,"Hiszen minél nagyobb mértékű szövegtudással rendelkeznek, annál többet képesek megérteni az intertextuális műalkotások egymásra rakódott üzeneteiből.","2026.09. 09-12. magyar irodalom 9.a, c,d R.-Sz.Zs..docx"],["Mutass be egy rövid példát intertextualitásra, és magyarázd meg, mit ad hozzá az előszöveg ismerete.","Ha egy eltévedt szereplő „Ariadné fonalát” keresi, az olvasó a labirintusból kivezető eszközt idézheti fel. A kifejezés így egy bonyolult helyzet megoldásának képévé válik.",null,null,"","",true]]},{"title":"Műnemek és műfajok","sources":[{"name":"2026. 09. 16. magyar irodalom 9. a, c, d.docx","url":null}],"qs":[["Az elbeszélő közvetítésével történetet elmondó művek műneme az ___.","epika","líra","dráma"],["A tragédia és a komédia közös műneme a ___.","dráma","líra","epika"],["A színpadi szereplők párbeszédeiből és tetteiből kibomló konfliktus a ___ jellemzője.","drámának","szócikknek","értekező tanulmánynak","A drámában a szereplők megszólalásai és cselekedetei közvetlenül jelenítik meg a konfliktust."],["Egy vers beszélője a veszteség miatti személyes érzéseit fogalmazza meg. Ez a ___ jellegzetes megszólalásmódja.","líra","krónika","eposz","A lírában gyakran a beszélő érzelmei, gondolatai és élményei állnak a középpontban."],["Ugyanaz a búcsújelenet hogyan jelenhetne meg lírában, epikában és drámában?","Lírában a beszélő veszteségérzése kerülhet előtérbe. Epikában elbeszélő mondja el, ki miért távozik. Drámában a szereplők szavaiból és tetteiből derül ki a konfliktus.",null,null,"","",true]]},{"title":"Az ősi magyar hitvilág","sources":[{"name":"2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx","url":null}],"qs":[["A magyar néphit természetfeletti képességű közvetítő alakja a ___.","táltos","trubadúr","rhapszódosz"],["A különböző világszinteket összekötő fa neve a hagyományban ___.","világfa","babérfa","olajfa"],["A túlvilágba vetett hitre következtethetünk, ha egy régészeti sírban ___ találunk.","az elhunyt mellé helyezett útravalót","mai útjelző táblát","modern térképi jelölést","A temetkezési melléklet segíthet a közösség túlvilágképének értelmezésében."],["Az ősi hiedelmek rekonstruálásakor a régészeti leletek mellett ___ is adhatnak támpontot.","népmondákban megőrzött motívumok","mai buszmenetrendek","kizárólag modern népszámlálások","A későbbi hagyomány őrizhet régebbi elemeket, bár ezek értelmezést igényelnek."],["A kérdés létjogosultságát az adhatja, hogy Krisztus születése és a honfoglalás között eltelt majdnem kilencszáz év, ami alatt a magyarság kapcsolatba kerülhetett volna a ___.","kereszténységgel",null,null,"A kérdés létjogosultságát az adhatja, hogy Krisztus születése és a honfoglalás között eltelt majdnem kilencszáz év, ami alatt a magyarság kapcsolatba kerülhetett volna a kereszténységgel.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Tudható, hogy az ázsiai pusztán élő népek körében gyorsan terjedtek el a nagy világvallások (a buddhizmus és az iszlám is), illetve ___ egybe saját vallási hagyományaikkal.","olvadtak",null,null,"Tudható, hogy az ázsiai pusztán élő népek körében gyorsan terjedtek el a nagy világvallások (a buddhizmus és az iszlám is), illetve olvadtak egybe saját vallási hagyományaikkal.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az biztos, hogy a ___ átvételekor a magyarságnak már saját szavai voltak fontos vallási fogalmakra.","kereszténység",null,null,"Az biztos, hogy a kereszténység átvételekor a magyarságnak már saját szavai voltak fontos vallási fogalmakra.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Erre példa az Isten, lélek vagy az egy szavunk – utóbbinak eredeti ___ szent volt, tehát nem egy számnevet jelölt; ez él tovább az egyház szóban.","jelentése",null,null,"Erre példa az Isten, lélek vagy az egy szavunk – utóbbinak eredeti jelentése szent volt, tehát nem egy számnevet jelölt; ez él tovább az egyház szóban.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Egy 910 körül keletkezett arab ___ (Ibn Ruszta) a magyarokat tűzimádónak nevezi – de ugyanitt olvashatjuk azt is, hogy egyetlen istent imádnak a magyarok, akit az Ég Urának neveznek (sok sztyeppei nép Tengrit, az Ég-Istent imádta).","forrás",null,null,"Egy 910 körül keletkezett arab forrás (Ibn Ruszta) a magyarokat tűzimádónak nevezi – de ugyanitt olvashatjuk azt is, hogy egyetlen istent imádnak a magyarok, akit az Ég Urának neveznek (sok sztyeppei nép Tengrit, az Ég-Istent imádta).","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A ___ idején „pogány vallásnak” nevezték a régi hitet.","kereszténység",null,null,"A kereszténység idején „pogány vallásnak” nevezték a régi hitet.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Tehát minden bizonnyal létezett egyfajta egyistenhit, de ez nem mutat kapcsolatot a ___.","kereszténységgel",null,null,"Tehát minden bizonnyal létezett egyfajta egyistenhit, de ez nem mutat kapcsolatot a kereszténységgel.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A pogány (tehát ___ előtti), mágikus eljárások és szokások még az új hit elterjedése után is sokáig megmaradtak.","kereszténység",null,null,"A pogány (tehát kereszténység előtti), mágikus eljárások és szokások még az új hit elterjedése után is sokáig megmaradtak.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A ___ szertartások, áldozatbemutatás és bálványok mellett a régi hithez hozzátartoztak még jósok, boszorkányok és varázslók is.","természeti",null,null,"A természeti szertartások, áldozatbemutatás és bálványok mellett a régi hithez hozzátartoztak még jósok, boszorkányok és varázslók is.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az említett népek hitvilágának központi eleme az animizmus: eszerint a minket körülvevő világot szellemek népesítik be (a ___ szellemei, az ősök szellemei).","természet",null,null,"Az említett népek hitvilágának központi eleme az animizmus: eszerint a minket körülvevő világot szellemek népesítik be (a természet szellemei, az ősök szellemei).","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A ___ tevékenysége mágikus eljárásokat foglal magában, fő feladata közvetíteni a szellemvilág és egy adott közösség között.","sámán",null,null,"A sámán tevékenysége mágikus eljárásokat foglal magában, fő feladata közvetíteni a szellemvilág és egy adott közösség között.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A ___ mindig segítő állatokkal bír, akik a túlvilági utazás során vele tartanak, sokszor helyette mennek a küzdelembe az ártó szellemek ellen vívott harc során.","sámán",null,null,"A sámán mindig segítő állatokkal bír, akik a túlvilági utazás során vele tartanak, sokszor helyette mennek a küzdelembe az ártó szellemek ellen vívott harc során.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A táltos szóval legkorábban a 13. században találkozunk, de bizonyosan létezett a honfoglalás korát megelőző kultúrában is: a mágia, jóslás, gyógyítás „szakemberét” ___ vele.","jelölték",null,null,"A táltos szóval legkorábban a 13. században találkozunk, de bizonyosan létezett a honfoglalás korát megelőző kultúrában is: a mágia, jóslás, gyógyítás „szakemberét” jelölték vele.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Látják a földben elásott kincset, igyekeznek befolyásolni az időjárást: állattá (gyakran bikává) változva viaskodnak az időjárást elrontó másik ___ vagy szellemmel.","táltossal",null,null,"Látják a földben elásott kincset, igyekeznek befolyásolni az időjárást: állattá (gyakran bikává) változva viaskodnak az időjárást elrontó másik táltossal vagy szellemmel.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A 20. századi kutatók a táltost a magyar ősvallás ___, annak megőrzőjének tekintették.","sámánjának",null,null,"A 20. századi kutatók a táltost a magyar ősvallás sámánjának, annak megőrzőjének tekintették.","2026.09.23.magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Miért igényel óvatosságot, ha egy később lejegyzett népmondából következtetünk az ősi magyar hitvilágra?","A lejegyzés és a feltételezett eredet ideje eltérhet. A történet továbbadás közben új, például keresztény motívumokkal egészülhetett ki. Több forrást kell összevetni.",null,null,"","",true]]},{"title":"A csodaszarvas mondája","sources":[{"name":"2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx","url":null}],"qs":[["A csodaszarvast üldöző testvérpár ___.","Hunor és Magor","Romulus és Remus","Kasztór és Polüdeukész"],["Az eredetmonda egy közösség ___ magyarázza elbeszélés formájában.","származását","helyesírását","jogrendszerét"],["Hunor és Magor történetében a csodaszarvas ___ szerepet tölt be.","új tájra vezeti a testvéreket","várost alapít helyettük","törvényeket ad nekik","Az állat üldözése indítja útnak a testvérpárt."],["A csodaszarvas mondájának közösségi szerepe, hogy ___.","közös múltat beszél el a leszármazottaknak","pontos népességszámot közöl","tudományos állatrendszertant alkot","Az eredettörténet a közösség összetartozását a közös ősökhöz kapcsolja."],["Feltételezhetően a honfoglaló magyarok hozták magukkal keletről ___ és Magor történetét.","Hunor",null,null,"Feltételezhetően a honfoglaló magyarok hozták magukkal keletről Hunor és Magor történetét.","2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx"],["Egyes elemeit a néphagyomány, a középkori ___ és Anonymus Gesta Hungarorum című műve is megőrizte, de legrészletesebb leírását Kézai Simon krónikájából, a szintén Gesta Hungarorum című munkából ismerhetjük.","mondavilág",null,null,"Egyes elemeit a néphagyomány, a középkori mondavilág és Anonymus Gesta Hungarorum című műve is megőrizte, de legrészletesebb leírását Kézai Simon krónikájából, a szintén Gesta Hungarorum című munkából ismerhetjük.","2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx"],["A ___ a Bibliából ismert bábeli zűrzavar után indul.","monda",null,null,"A monda a Bibliából ismert bábeli zűrzavar után indul.","2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx"], képződik, száll alá a földre – a valós történet.","Hunor",null,null,"Mikor Hunor és Magor a szarvast űzi, gyakran női alakot ölt az állat; a földi történet mellett pedig megjelenik égi, jelképes mása is, a csillagképeken is tükröződik – vagy éppen onnan képződik, száll alá a földre – a valós történet.","2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx"],["Az égi szarvas-csillagképre tekintenek fel aztán a honfoglalás korának hős vezérei és a magyar népet ___ vezető fejedelmei.","kereszténységre",null,null,"Az égi szarvas-csillagképre tekintenek fel aztán a honfoglalás korának hős vezérei és a magyar népet kereszténységre vezető fejedelmei.","2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx"],["A szarvas ekkor új ___ bővül: bár eddig is egyfajta égi közvetítőnek (is) értelmezhettük, most mindez keresztény tartalmat kap.","jelentéselemmel",null,null,"A szarvas ekkor új jelentéselemmel bővül: bár eddig is egyfajta égi közvetítőnek (is) értelmezhettük, most mindez keresztény tartalmat kap.","2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx"],["Bár a film nem mutatja be, de Szent László (1077–1095) ___ is fennmaradt egy monda a Képes Krónikában, melyben hasonló szerepben jelenik meg a szarvas.","királyról",null,null,"Bár a film nem mutatja be, de Szent László (1077–1095) királyról is fennmaradt egy monda a Képes Krónikában, melyben hasonló szerepben jelenik meg a szarvas.","2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx"],["Noha kimennél, uram, Szent István ___,De ha nem találnál sem vadat, sem madarat,Hanem csak találnál csodafiú-szarvast,Haj, regö-rejtem, regö-rejtem,Ne siess, ne siess, uram, Szent István királyAz én halálomra.","királyVadászni-madarászni",null,null,"Noha kimennél, uram, Szent István királyVadászni-madarászni,De ha nem találnál sem vadat, sem madarat,Hanem csak találnál csodafiú-szarvast,Haj, regö-rejtem, regö-rejtem,Ne siess, ne siess, uram, Szent István királyAz én halálomra.","2026.09. 30. magyar irodalom 9.a, 9.c,9.d R.-Sz.Zs..docx"],["Milyen szerepe van a szarvas üldözésének Hunor és Magor történetében?","Elindítja a testvéreket, új tájra vezeti őket, és összeköti a kalandot a közösség eredetének elbeszélésével.",null,null,"","",true]]},{"title":"Görög istenek és mítoszok","sources":[{"name":"2026.10.07. magyar irodalom 9.a,9.c,9.d R.-Sz.Zs..docx","url":null},{"name":"2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx","url":null}],"qs":[["A görög istenek hírnöke ___.","Hermész","Poszeidón","Héphaisztosz"],["A mítosz szerint Hermész a teknős páncéljából ___ készített.","lírát","pajzsot","sípot"],["A görög mitológiában a tengerek istene ___.","Poszeidón","Árész","Apollón"],["Hermész a történetben ___ csordáját hajtotta el.","Apollón","Hádész","Poszeidón","A lopás és a líra története összekapcsolja Hermész és Apollón alakját."],["Az olümposzi istenek emberi alakja és emberi indulatai ___ szemléletet mutatnak.","antropomorf","időmértékes","elbeszélői nézőpont nélküli","Az antropomorf ember alakúként vagy emberi tulajdonságokkal felruházva ábrázoltat jelent."],["Mint a mítoszok általában, a görög mítoszok is későbbi feljegyzések, írott ___ révén tanulmányozhatók.","források",null,null,"Mint a mítoszok általában, a görög mítoszok is későbbi feljegyzések, írott források révén tanulmányozhatók.","2026.10.07. magyar irodalom 9.a,9.c,9.d R.-Sz.Zs..docx"],["A legelső források, amelyekben a görög istenekről olvashatunk, Homérosz és ___ művei, a Kr. e. 8–7. századból maradtak fenn.","Hésziodosz",null,null,"A legelső források, amelyekben a görög istenekről olvashatunk, Homérosz és Hésziodosz művei, a Kr. e. 8–7. századból maradtak fenn.","2026.10.07. magyar irodalom 9.a,9.c,9.d R.-Sz.Zs..docx"],["A homéroszi ___, amelyekben sok isten megjelenik, később beszélünk.","eposzokról",null,null,"A homéroszi eposzokról, amelyekben sok isten megjelenik, később beszélünk.","2026.10.07. magyar irodalom 9.a,9.c,9.d R.-Sz.Zs..docx"],["___ költeménye, az Istenek születése a világ keletkezésének b szerelmi kalandját.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Ezért kígyókat küldött a csecsemő ___ megölésére, ám a gyermek elpusztította az ellene küldött állatokat.","Héraklész",null,null,"Ezért kígyókat küldött a csecsemő Héraklész megölésére, ám a gyermek elpusztította az ellene küldött állatokat.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Hirtelen ___ fakadóan agyonütötte oktatóját, amiért a hegyekbe küldték pásztornak. 18 éves volt, amikor megölte a Khitairón hegyén lakozó oroszlánt.","természetéből",null,null,"Hirtelen természetéből fakadóan agyonütötte oktatóját, amiért a hegyekbe küldték pásztornak. 18 éves volt, amikor megölte a Khitairón hegyén lakozó oroszlánt.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["A Minótaurosz legyőzése ___ egyik leghíresebb kalandja.","Thészeusz",null,null,"A Minótaurosz legyőzése Thészeusz egyik leghíresebb kalandja.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["___, krétai király fiát megölték az athéniak, ami miatt a király elégtételt követelt.","Minósz",null,null,"Minósz, krétai király fiát megölték az athéniak, ami miatt a király elégtételt követelt.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Azt parancsolta, hogy ___ évente hét fiút és hét lányt áldozzon a labirintusban lakó Minótaurosznak.","Athén",null,null,"Azt parancsolta, hogy Athén évente hét fiút és hét lányt áldozzon a labirintusban lakó Minótaurosznak.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["___ önként jelentkezett, hogy megölje a szörnyet.","Thészeusz",null,null,"Thészeusz önként jelentkezett, hogy megölje a szörnyet.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Ariadné, a krétai király lánya közben beleszeretett ___ és hogy segítse, egy gombolyag fonalat adott neki, hogy az utat a labirintusban ezzel megjelölve, kiutat találhasson a kaland végén.","Thészeuszba",null,null,"Ariadné, a krétai király lánya közben beleszeretett Thészeuszba és hogy segítse, egy gombolyag fonalat adott neki, hogy az utat a labirintusban ezzel megjelölve, kiutat találhasson a kaland végén.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["___, miután megölte a Minótauroszt, a gombolyag segítségével sikeresen kijutott a labirintusból, és kiszabadította az athéniakat.","Thészeusz",null,null,"Thészeusz, miután megölte a Minótauroszt, a gombolyag segítségével sikeresen kijutott a labirintusból, és kiszabadította az athéniakat.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["___ szerelmét azonban hűtlenséggel viszonozta, ezért meglakolt.","Ariadné",null,null,"Ariadné szerelmét azonban hűtlenséggel viszonozta, ezért meglakolt.","2026. 10. 14. magyar irodalom 9. a, 9.c,9.d R.-Sz.Zs..docx"],["Hogyan kapcsolódik Ariadné fonala, a Minótaurosz és a fekete vitorla Thészeusz történetéhez?","Thészeusz megöli a Minótauroszt, a fonal segítségével kijut a labirintusból. Hazafelé elfelejti a megbeszélt vitorlacserét, ezért apja azt hiszi, hogy fia meghalt.",null,null,"","",true]]},{"title":"Homérosz és az eposz","sources":[{"name":"2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx","url":null},{"name":"2026. 11. 11-14. magyar irodalom 9.a,9.c,9.d R.-Sz.Zs..docx","url":null}],"qs":[["Az Iliász középpontjában ___ haragja áll.","Akhilleusz","Odüsszeusz","Hermész"],["Az Odüsszeia hőse a trójai háború után ___ igyekszik hazatérni.","Ithakába","Spártába","Krétára"],["Az eposz elején az isteni segítség kérése az ___.","invokáció","epilógus","allegória"],["A történet közepébe vágó eposzkezdés neve ___.","in medias res","invokáció","állandó jelző","Az előzmények egy része csak később válik ismertté a befogadó számára."],["A „leleményes Odüsszeusz” visszatérő szókapcsolat az eposzi kellékek közül ___.","állandó jelző","seregszemle","isteni beavatkozás","A hőst ismétlődően ugyanazzal a rá jellemző tulajdonsággal nevezi meg."],["Később ezeket az énekeket leírták, összeszerkesztették: így születtek meg az ___.","eposzok",null,null,"Később ezeket az énekeket leírták, összeszerkesztették: így születtek meg az eposzok.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az eposz általában ___ írt nagyepikai műfaj.","hexameterekben",null,null,"Az eposz általában hexameterekben írt nagyepikai műfaj.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Nem minden kellék található meg minden ___.","eposzban",null,null,"Nem minden kellék található meg minden eposzban.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az ___ kellékek azok a retorikai eszközök, melyek kifejezik az ősi művek isteni és emberi eredetét, tagolják a művet.","eposzi",null,null,"Az eposzi kellékek azok a retorikai eszközök, melyek kifejezik az ősi művek isteni és emberi eredetét, tagolják a művet.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Ilyen eposzi kellék például a mű elején található segélykérés, invokáció, a költő fohászkodása, amelyben erőt és kitartást kér eposzírói munkájához – legtöbbször egy ___.","istennőtől",null,null,"Ilyen eposzi kellék például a mű elején található segélykérés, invokáció, a költő fohászkodása, amelyben erőt és kitartást kér eposzírói munkájához – legtöbbször egy istennőtől.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az antik ___ ez az istennő általában az epikus költészet múzsája, Kalliopé.","eposzokban",null,null,"Az antik eposzokban ez az istennő általában az epikus költészet múzsája, Kalliopé.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az eposz cselekményében fontos szerepet játszik a deus ex machina, a csodás elem, az ___ közbeavatkozás.","isteni",null,null,"Az eposz cselekményében fontos szerepet játszik a deus ex machina, a csodás elem, az isteni közbeavatkozás.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az ___ szereplő nagyobb tömegeket az enumerációban, seregszemlében vonultatja fel az író; a fontosabb szereplőknek állandó jelzőjük, epitheton ornansuk van.","eposzban",null,null,"Az eposzban szereplő nagyobb tömegeket az enumerációban, seregszemlében vonultatja fel az író; a fontosabb szereplőknek állandó jelzőjük, epitheton ornansuk van.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A görög ___, akárcsak a magyarban, a szótagok vagy hosszúak, vagy rövidek.","nyelvben",null,null,"A görög nyelvben, akárcsak a magyarban, a szótagok vagy hosszúak, vagy rövidek.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Akkor hosszú a szótag, ha a magánhangzó hosszú, vagy ___ végződik.","mássalhangzóra",null,null,"Akkor hosszú a szótag, ha a magánhangzó hosszú, vagy mássalhangzóra végződik.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Akkor rövid, ha a ___ rövid, és magánhangzóra végződik.","magánhangzója",null,null,"Akkor rövid, ha a magánhangzója rövid, és magánhangzóra végződik.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Fontos, hogy a verselés megállapításakor a verssorokat úgy kell ___, mintha egyetlen szóból állnának.","szótagolni",null,null,"Fontos, hogy a verselés megállapításakor a verssorokat úgy kell szótagolni, mintha egyetlen szóból állnának.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Az ___ verselés alapegysége a mora.","időmértékes",null,null,"Az időmértékes verselés alapegysége a mora.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Ez az időegység az, ameddig egy rövid ___ tart.","szótag",null,null,"Ez az időegység az, ameddig egy rövid szótag tart.","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["Ha rövid a ___, akkor egymorás (∪), ha hosszú, akkor kétmorás (−).","szótag",null,null,"Ha rövid a szótag, akkor egymorás (∪), ha hosszú, akkor kétmorás (−).","2026. 11. 04-07. magyar irodalom 9.a, 9.c, 9.d R.-Sz.Zs..docx"],["A ___ pedig lehetnek két-, három-, négy-, öt- vagy akár hatmorásak is.","verslába , magas szintű szövegértési és -értelmezési képesség – elavulttá, haszontalanná vált volna.","2026.10.07. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["Skype, Facebook, Twitter, Viber) és az egyre könnyebben hozzáférhető technikai eszközök segítségével két (vagy több) egymástól távoli ember közötti olyan kapcsolat hozható létre, amely már-már a közvetlen ___ meghittségének érzetét nyújtja.","kommunikáció",null,null,"Skype, Facebook, Twitter, Viber) és az egyre könnyebben hozzáférhető technikai eszközök segítségével két (vagy több) egymástól távoli ember közötti olyan kapcsolat hozható létre, amely már-már a közvetlen kommunikáció meghittségének érzetét nyújtja.","2026.10.07. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["Igaz ez a különféle kommunikációs szoftverek használatára is, főleg az írott ___.","kommunikációra",null,null,"Igaz ez a különféle kommunikációs szoftverek használatára is, főleg az írott kommunikációra.","2026.10.07. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["Ügyeljünk tehát arra, hogy ne adjunk ki privát, titkos vagy az azonosításunkat lehetővé tevő információkat ___ – nem tudhatjuk, hogy a beszélgetőtársunk, aki állítólag Angliában él, valójában nem a sarki internetkávézóból kérdezi-e lakcímünket, és várja, hogy üresen maradjon a lakás.","idegeneknek",null,null,"Ügyeljünk tehát arra, hogy ne adjunk ki privát, titkos vagy az azonosításunkat lehetővé tevő információkat idegeneknek – nem tudhatjuk, hogy a beszélgetőtársunk, aki állítólag Angliában él, valójában nem a sarki internetkávézóból kérdezi-e lakcímünket, és várja, hogy üresen maradjon a lakás.","2026.10.07. magyar nyelv 9.a,9.c,9.d R.-Sz.Zs..docx"],["Miben változik a befogadó szerepe, ha nyomtatott újság helyett hozzászólásokat engedő online híroldalt olvas?","A befogadó azonnal reagálhat és megoszthatja a közlést. Mások számára maga is közlővé válhat, így a visszacsatolás gyorsabb és láthatóbb.",null,null,"","",true]]},{"title":"Médiaműfajok","sources":[{"name":"2026.09. 30- 10.03. magyar nyel
